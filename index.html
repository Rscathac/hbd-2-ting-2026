    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
  }
  function sparkIdle() {
    sparkSize();
    SP.state = "idle"; SP.f = 1;
    SP.ctx.clearRect(0, 0, SP.W, SP.H);
    drawRod(1, false);
  }
  function ignite() {
    if (SP.state !== "idle") return;
    if (reduce) { SP.state = "out"; preloadRest(); return revealPair(); }
    SP.state = "burn"; SP.f = 1;
    lb.classList.add("dusk");
    preloadRest();
    SP.hint.style.opacity = "0";
    spawn(along(1), 70, [80, 280], [.25, .6], 0);   // 點燃的那一下
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
      if (SP.state === "burn") {
        SP.f -= dt / BURN * (1 - COAT);
        if (SP.f <= COAT) { SP.f = COAT; SP.state = "fading"; setTimeout(revealPair, reduce ? 0 : 250); }
        else spawn(along(SP.f), 9, [70, 260], [.22, .55], 0);
      }
      SP.ctx.clearRect(0, 0, SP.W, SP.H);
      drawRod(SP.f, true);
      drawParts(dt);
      if (SP.state === "fading" && !SP.parts.length) { SP.state = "out"; return; }
      SP.raf = requestAnimationFrame(frame);
    };
    SP.raf = requestAnimationFrame(frame);
  }
  SP.btn.addEventListener("click", ignite);
  addEventListener("resize", () => { if (SP.state === "idle" && !SP.wrap.hidden) sparkIdle(); });

  // 點燃時就先把後面的影片載好，燒完時才知道比例、不用等
  let rest = [];
  function preloadRest() {
    rest = secretAll.slice(1).map((it) => {
      const v = document.createElement("video");
      Object.assign(v, { src: it.video, poster: it.poster, loop: true, playsInline: true, preload: "auto", muted: true });
      v.setAttribute("muted", "");
      v.addEventListener("click", () => (v.paused ? v.play() : v.pause()));
      return v;
    });
  }
  const meta = (v) => v.readyState >= 1 ? Promise.resolve() : new Promise((r) => v.addEventListener("loadedmetadata", r, { once: true }));

  // 燒完：第一支不動，第二支從旁邊慢慢長出來，卡片同時變寬，仙女棒的位置一起收掉
  async function revealPair() {
    if (revealPair.done) return;
    revealPair.done = true;
    window.foundEgg?.("hanabi");
    const box = $("lbPhotos"), card = lb.querySelector(".lb-card"), v1 = box.querySelector("video");
    await Promise.all([v1, ...rest].map(meta));
    const ars = [v1, ...rest].map((v) => (v.videoWidth / v.videoHeight) || 1);
    const sum = ars.reduce((a, b) => a + b, 0);
    const stack = sum > 1.8 && innerWidth <= 600;
    // 先把目前的寬度寫死，等一下才有東西可以慢慢變
    card.style.width = card.getBoundingClientRect().width + "px";
    box.classList.add("pair", "growing");
    box.classList.toggle("landscape", sum > 1.8);
    box.style.setProperty("--n", ars.length);
    v1.style.setProperty("--ar", ars[0].toFixed(3));
    rest.forEach((v, i) => {
      v.style.setProperty("--ar", ars[i + 1].toFixed(3));
      v.classList.add("new");
      if (stack) { v.style.maxHeight = "0px"; v.style.opacity = "0"; }
      else { v.style.flexGrow = "0"; v.style.opacity = "0"; }
      box.append(v);
      v.play().catch(() => {});
    });
    void box.offsetWidth;
    SP.wrap.classList.add("gone");
    card.classList.add("has-pair");
    requestAnimationFrame(() => {
      if (!stack) card.style.width = `min(100%, ${Math.round(Math.min(820, innerHeight * .6 * sum + 8 * ars.length + 28))}px)`;
      rest.forEach((v) => { v.style.flexGrow = ""; v.style.maxHeight = ""; v.style.opacity = "1"; });
    });
    setTimeout(() => { box.classList.remove("growing"); }, 1200);
    setTimeout(() => seedWords(true), reduce ? 0 : 1000);   // 兩支影片並排好之後，字才浮出來
  }

  if (secretSeed) {
    secretSeed.addEventListener("click", openSecret);
    secretSeed.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSecret(e); } });
  }

  function closeMonth() {
    if (lb.hidden) return;
    lb.classList.remove("on");
    setTimeout(() => { lb.hidden = true; }, reduce ? 0 : 350);
    if (secretOpen) {
      secretOpen = false;
      $("lbPhotos").querySelectorAll("video").forEach((v) => v.pause());
      resetSparkler(true);
      $("lbClose").textContent = mode === "review" ? CARD.putBack : CARD.keepPetal;
      secretSeed.focus({ preventScroll: true });
      return;
    }
    const p = lastPetal;
    if (mode === "review") {
      // 看照片模式：花瓣飛回花上
      p.g.classList.remove("plucked", "back-in"); void p.g.getBBox(); p.g.classList.add("back-in");
      p.g.focus({ preventScroll: true });
      return;
    }
    if (!collected.has(p.i)) {
      collected.add(p.i);
      window.foundEgg?.("months", "m" + p.i);   // 花藏亡靈：12 個月的照片都看過
      tally.children[p.i].classList.add("got");
      tally.setAttribute("aria-label", `已收下 ${collected.size}／${n} 片花瓣`);
    }
    const next = petals.find((q) => !collected.has(q.i));
    if (next) next.g.focus({ preventScroll: true });
    else allCollected();
  }

  // 12 片都收下了：花心一明一暗，等人去點
  let mode = "pluck";   // pluck：要一片一片收；review：看完信回來，隨便看
  function allCollected() {
    pflower.classList.add("done");
    $("stageNote").innerHTML = textHTML(CARD.petalsDone);
    $("stageNote").style.opacity = "1";
    core.setAttribute("tabindex", "0"); core.setAttribute("role", "button"); core.setAttribute("aria-label", "打開花心，讀信");
    core.focus({ preventScroll: true });
  }
  core.addEventListener("click", () => { if (pflower.classList.contains("done")) openHeart(); });
  core.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && pflower.classList.contains("done")) { e.preventDefault(); openHeart(); } });

  const sleep = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 120) : ms));
  async function openHeart() {
    if (busy) return;
    busy = true;
    pflower.classList.remove("done");
    core.removeAttribute("tabindex"); core.removeAttribute("role");
    const box = pf.getBoundingClientRect(), s = box.width / 600;
    const ox = box.left + box.width / 2, oy = box.top + box.height / 2;
    if (!reduce) seedBurst(ox, oy, s);
    pflower.classList.add("burst");
    // 跟封面一樣：花心的咖啡色從中間漫開，蓋滿畫面再換成信
    const bloom = $("bloom");
    bloom.style.setProperty("--cx", ox + "px"); bloom.style.setProperty("--cy", oy + "px");
    await sleep(450);
    bloom.classList.remove("fade"); bloom.classList.add("grow");
    await sleep(1000);
    showCake();
    bloom.classList.add("fade");
    await sleep(800);
    bloom.classList.remove("grow");
    busy = false;
  }

  // 種子沿著螺旋往外爆開，同時朝鏡頭飛過來（越近越大）
  function seedBurst(ox, oy, s) {
    const dpr = Math.min(2, devicePixelRatio || 1);
    const cv = document.createElement("canvas");
    cv.className = "seed-burst"; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    flyLayer.append(cv);
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const seeds = [...core.querySelectorAll("circle")].slice(1).filter((_, k) => k % 3 === 0).map((c) => {
      const x = +c.getAttribute("cx"), y = +c.getAttribute("cy"), r0 = Math.hypot(x, y) || 1;
      return { x: x * s, y: y * s, r: +c.getAttribute("r") * s, fill: c.getAttribute("fill"),
               ux: x / r0, uy: y / r0, out: 60 + Math.random() * 260, z: 380 + Math.random() * 520, spin: Math.random() * .6 };
    });
    const T = 1300, t0 = performance.now(), f = 900;
    const frame = (now) => {
      const t = Math.max(0, Math.min(1, (now - t0) / T)), e = 1 - Math.pow(1 - t, 3);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const q of seeds) {
        const k = f / (f - q.z * e);                         // 透視：越靠近鏡頭越大
        const ang = q.spin * e;                              // 帶一點旋轉，像螺旋散開
        const dx = q.x + q.ux * q.out * e, dy = q.y + q.uy * q.out * e;
        const x = ox + (dx * Math.cos(ang) - dy * Math.sin(ang)) * k;
        const y = oy + (dx * Math.sin(ang) + dy * Math.cos(ang)) * k;

        ctx.beginPath(); ctx.arc(x, y, q.r * k, 0, Math.PI * 2); ctx.fill();
      }

    };
    requestAnimationFrame(frame);
  }

  /* ── 吹蠟燭：全部吹熄，信才出現 ── */
  const cakeScene = $("cakeScene"), cakeBox = $("cake"), cakeSvg = $("cakeSvg");
  let candles = [], cakeBuilt = false, mic = null, cakeEnding = false;
  function buildCake() {

    };
    // 光影：圓柱側面中間亮、兩邊暗；頂面中間亮
    grad("cakeSide", "linearGradient", [["0", "#DCCFBB"], [".22", "#F4ECDF"], [".5", "#FFFCF6"], [".78", "#F1E8DA"], ["1", "#D6C9B4"]], { x1: 0, x2: 1, y1: 0, y2: 0 });
    grad("cakeTop", "radialGradient", [["0", "#FFFFFF"], [".7", "#FAF5EC"], ["1", "#EDE4D5"]], { cx: ".5", cy: ".45", r: ".6" });
    grad("cream", "radialGradient", [["0", "#FFFFFF"], [".55", "#FBF7F0"], ["1", "#E2D7C6"]], { cx: ".38", cy: ".32", r: ".75" });
    grad("berry", "radialGradient", [["0", "#F2676A"], [".55", "#D7323C"], ["1", "#A51F2B"]], { cx: ".38", cy: ".35", r: ".75" });
    grad("plate", "linearGradient", [["0", "#D9D3C8"], [".3", "#F3EFE8"], [".55", "#FFFFFF"], [".8", "#EEE9E0"], ["1", "#CFC8BB"]], { x1: 0, x2: 1, y1: 0, y2: 0 });
    grad("candleGlow", "radialGradient", [["0", "rgba(255,206,130,.55)"], ["1", "rgba(255,190,110,0)"]], {});
    const st = S("pattern", { id: "candleStripe", width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(35)" }, defs);
    S("rect", { width: 8, height: 8, fill: "#FBF4E2" }, st);
    S("rect", { width: 3.5, height: 8, fill: "#F1B3A8" }, st);
    // 一點點不規則的邊，像手畫的
    const f = S("filter", { id: "hand", x: "-5%", y: "-5%", width: "110%", height: "110%" }, defs);
    S("feTurbulence", { type: "fractalNoise", baseFrequency: ".045", numOctaves: 2, seed: 5 }, f);
    S("feDisplacementMap", { in: "SourceGraphic", scale: 2.2 }, f);

    const CX = 200, RX = 112, RY = 24, YT = 150, YB = 248;

    // 蛋糕架
    grad("floorShadow", "radialGradient", [["0", "rgba(0,0,0,.45)"], ["1", "rgba(0,0,0,0)"]], {});
    S("ellipse", { cx: CX, cy: 306, rx: 92, ry: 12, fill: "url(#floorShadow)" });
    S("path", { d: "M150 304 Q200 290 250 304 A50 7 0 0 1 150 304Z", fill: "url(#plate)" });
    S("rect", { x: 190, y: 270, width: 20, height: 30, fill: "url(#plate)" });
    S("ellipse", { cx: CX, cy: 268, rx: 152, ry: 27, fill: "#BDB5A8" });
    S("ellipse", { cx: CX, cy: 263, rx: 152, ry: 27, fill: "url(#plate)" });
    S("ellipse", { cx: CX, cy: 261, rx: 140, ry: 22, fill: "#F7F4EE" });
    // 蛋糕在盤子上的影子

    {

      S("path", { d: "M0 11 C-10 4 -10 -6 0 -6 C10 -6 10 4 0 11Z", fill: "url(#berry)" }, g);

        S("ellipse", { cx: sx, cy: sy, rx: .55, ry: .85, fill: "#F7DDA0" }, g));
      S("path", { d: "M0 -6 L-7 -9 L-3 -6 L-5 -11 L0 -7 L5 -11 L3 -6 L7 -9 Z", fill: "#6E9A55" }, g);
      S("path", { d: "M-3.5 -1 Q-4.5 -4 -1.5 -4.5", stroke: "rgba(255,255,255,.55)", "stroke-width": 1, fill: "none", "stroke-linecap": "round" }, g);
    };
    const ring = Array.from({ length: 14 }, (_, k) => {

    });
    ring.forEach((r, k) => { r.berry = !r.front && k % 2 === 0; });   // 草莓只放後半圈，前面留給角色
    const drawRing = (front) => ring.filter((r) => r.front === front).sort((a, b) => a.y - b.y)
      .forEach((r) => {

      };

  function litCount() { return candles.filter((c) => !c.out).length; }
  function showCake() {
    if (!cakeBuilt) candles = buildCake();
    cakeEnding = false;
    candles.forEach((c) => { c.out = false; c.hp = 1; c.el.classList.remove("out"); });

    cakeScene.style.setProperty("--lit", 1);

    $("cakeNote").innerHTML = textHTML(CARD.cakeNote);
    cakeScene.querySelector(".cake-actions").style.opacity = "1";
    cakeScene.hidden = false;
    requestAnimationFrame(() => cakeScene.classList.add("on"));
    cakeScene.setAttribute("tabindex", "-1"); cakeScene.focus({ preventScroll: true });
  }
  function hideCake() { cakeScene.classList.remove("on"); cakeScene.hidden = true; }
  function blowOut(c) {
    if (c.out) return;
    c.out = true;
    c.el.classList.add("out");
    // 兩縷細細的煙，一前一後飄上去
    [0, .35].forEach((delay) => {
      const sm = document.createElement("div");
      sm.className = "smoke"; sm.style.left = c.el.style.left; sm.style.top = c.el.style.top;
      sm.style.setProperty("--sx", (Math.random() * 30 - 12).toFixed(0) + "px");
      sm.style.setProperty("--sd", delay + "s");
      cakeBox.append(sm);
      setTimeout(() => sm.remove(), 3600);
    });
    cakeScene.style.setProperty("--lit", (litCount() / candles.length).toFixed(2));
    if (!litCount()) finishCake();
  }
  async function finishCake() {
    if (cakeEnding) return;
    cakeEnding = true;
    window.foundEgg?.("wish");
    cakeScene.querySelector(".cake-actions").style.opacity = "0";
    $("cakeNote").innerHTML = textHTML(CARD.cakeDone);
    await sleep(2200);
    showLetter();
    cakeScene.classList.remove("on");
    await sleep(1300);
    cakeScene.hidden = true;
  }

  // 用手指／滑鼠把火焰撥熄：按著劃過去，或滑鼠快速掃過
  let lastMove = null;
  cakeScene.addEventListener("pointermove", (e) => {
    const now = performance.now();
    const speed = lastMove ? Math.hypot(e.clientX - lastMove.x, e.clientY - lastMove.y) / Math.max(1, now - lastMove.t) : 0;
    lastMove = { x: e.clientX, y: e.clientY, t: now };
    // 手揮過去像一陣風：越近、越快，火焰倒得越多
    const vx = lastMove && e.movementX !== undefined ? e.movementX : 0;
    candles.forEach((c) => {
      if (c.out) return;
      const r = c.el.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));

<script>
/* ── 信封：燭光、隱形墨水、蠟封轉盤 ── */

  $("envTo").textContent = CARD.to;
  // 郵票和郵戳都用生日那天
  { const [y, m, d] = CARD.date.split("-"); $("pmDate").textContent = `${y}.${m}.${d}`; $("stampDate").textContent = `${+m}.${d}`; }

    await wait(560);

  }
  const peekTimer = setInterval(() => { if (!touched) peek(); }, 6500);
  setTimeout(() => { if (!touched) peek(); }, 2200);

  let fd = null;
  front.addEventListener("pointerdown", (e) => {
    if (side !== "front") return;
    if (fd) release();   // 上一次的拖曳沒收尾（例如放開時游標在視窗外），先收掉

    const t = i / 48 * Math.PI * 2;
    const r = 104 + Math.sin(t * 5) * 2.5 + Math.sin(t * 9 + 1) * 2 + (Math.random() - .5) * 2.2;

      const idx = Math.round(local / R.step) % R.n;
      R.rot += norm(-idx * R.step - R.rot);

    apply(R, true);

    settle();
  }
  Object.values(rings).forEach((R) => R.g.addEventListener("keydown", (e) => {
    if (opened) return;
    const k = { ArrowRight: -1, ArrowUp: -1, ArrowLeft: 1, ArrowDown: 1 }[e.key];
    if (!k) return;
    e.preventDefault(); usedKeys = true;

  }
  function stopFireworks() { cancelAnimationFrame(fw.raf); fw.raf = 0; fw.rockets = []; fw.parts = []; const c = mtFw.getContext("2d"); c.clearRect(0, 0, mtFw.width, mtFw.height); }

  function startMatsuri(sec) {
    endNight(true);
    mt = { sec, her: mtHer, x: MT_HOME, found: { ame: false, kingyo: false }, finale: false, busy: false, timers: [] };
    if (!mtBuilt) buildMatsuri(sec);
    const a = sec.song ? songFor(sec.song) : null;
    night = { key: sec.date, a, timers: mt.timers, matsuri: true };
    stage.classList.add("in-room", "matsuri-mode");
    if (a) {
      if (window.__card.duck) window.__card.duck(true);
      a.currentTime = sec.songStart || 0; a.volume = 0; playSong(a).then(() => fadeVol(a, songVol(sec), 2500)).catch(() => {});
    }
    mt.her.classList.remove("has-ame", "has-kingyo", "walk", "hop");
    placeHer(MT_HOME, 0);
    mtSvg.querySelector(".drum-g").classList.remove("ready", "hit");
    mtFinale.classList.remove("on"); mtFinale.textContent = "";
    mtEl.classList.remove("lit", "sway");
    mtEl.hidden = false;
    requestAnimationFrame(() => { mtEl.classList.add("on"); mt.timers.push(setTimeout(() => mtEl.classList.add("lit"), reduce ? 0 : 900)); });
  }
  $("matsuriBack").addEventListener("click", () => { if (!mtZoom.hidden) return closeMtZoom(); endNight(); setRiddle(CARD.riddle); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !mtZoom.hidden) closeMtZoom(); });
  window.__card = Object.assign(window.__card || {}, { matsuri: () => startMatsuri((CARD.dialSecrets || []).find((x) => x.scene === "matsuri") || { date: "08-05" }) });

  let night = null;
  function startNight(sec) {
    endNight(true);
    const a = sec.song ? songFor(sec.song) : null;
    night = { key: sec.date, a, timers: [] };
    stage.classList.add("nocturne");
    stage.classList.toggle("dance", !!sec.dance);
    setRiddle("");
    // 一個字一個字排好出現的時間
    const cols = document.createElement("div");
    cols.className = "cols";
    const per = .17, gap = 1.8, start = sec.songStart || 0;
    let t = 1.4, last = 0;   // last：最後一個字開始浮現的時間
    sec.poem.forEach((line, i) => {
      if (sec.times && sec.times[i] != null) t = sec.times[i] - start;
      const p = document.createElement("p");
      const zh = sec.zh && sec.zh[i];
      p.setAttribute("aria-label", zh ? `${line}（${zh}）` : line);
      const jp = document.createElement("span"); jp.className = "jp";
      const chars = [...line], L = chars.length;
      // meet：從頭尾兩端同時往中間浮現，像兩個人走向彼此
      const order = (k) => sec.reveal === "meet" ? Math.min(k, L - 1 - k) * 1.7 : k;
      chars.forEach((ch, k) => {
        const span = document.createElement("span");
        span.className = "ch"; span.textContent = ch; span.setAttribute("aria-hidden", "true");
        span.style.setProperty("--t", (t + order(k) * per).toFixed(2) + "s");
        last = Math.max(last, t + order(k) * per);
        jp.append(span);
      });
      p.append(jp);
      if (zh) {
        const z = document.createElement("span");
        z.className = "zh"; z.textContent = zh; z.setAttribute("aria-hidden", "true");
        p.append(z);
        // 這一句整句出現之後，燭光才照得出中文
        p.dataset.ready = performance.now() + (t + (sec.reveal === "meet" ? Math.ceil(L / 2) * 1.7 : L) * per + 1.5) * 1000;
      }
      cols.append(p);
      t += (sec.reveal === "meet" ? Math.ceil(L / 2) * 1.7 : L) * per + gap;
    });
    nightPoem.replaceChildren(cols);
    // 歌詞全部跑完（最後一個字浮現後）才算找到這個彩蛋；中途轉走或離開就不算
    const egg = { "09-19": "daiichiya", "10-14": "pasdedeux" }[sec.date];
    if (egg) night.timers.push(setTimeout(() => window.foundEgg?.(egg), (reduce ? 0 : last + 1.5) * 1000));
    placePoem();
    nightPoem.hidden = false;
    requestAnimationFrame(() => nightPoem.classList.add("on"));
    if (a) {
      a.currentTime = start; a.volume = 0;
      playSong(a).then(() => fadeVol(a, songVol(sec), 2500)).catch(() => {});
    }
  }
  function endNight(fast) {
    if (!night) return;
    const n = night; night = null;
    n.timers.forEach(clearTimeout);
    stage.classList.remove("nocturne", "dance", "in-room");
    nightPoem.classList.remove("on");
    if (n.room && window.__card.duck) window.__card.duck(false);
    if (n.xmas) { stage.classList.remove("xmas-mode"); closeZoom(xmasZoom); if (window.__card.duck) window.__card.duck(false); xmasEl.classList.remove("on"); setTimeout(() => { if (!night || !night.xmas) xmasEl.hidden = true; }, fast ? 0 : 1600); }
    if (n.matsuri) { stage.classList.remove("matsuri-mode"); closeMtZoom(); stopFireworks(); if (window.__card.duck) window.__card.duck(false); mtEl.classList.remove("on"); setTimeout(() => { if (!night || !night.matsuri) mtEl.hidden = true; }, fast ? 0 : 1600); mt = null; }
    if (n.room) { stopGuitar(false); resetMirror(); resetScreens(); roomEl.classList.remove("on", "done", "open", "nudge"); setTimeout(() => { if (!night || !night.room) roomEl.hidden = true; }, fast ? 0 : 1600); }
    setTimeout(() => { if (!night) { nightPoem.hidden = true; nightPoem.replaceChildren(); } }, fast ? 0 : 1400);
    if (n.a) { n.a._live = false; fadeVol(n.a, 0, fast ? 300 : 1600, () => { if (!n.a._live) n.a.pause(); }); }
  }

  /* ── 看有聲音的影片時，背景音樂先停，看完再接著播 ── */
  let ducked = false;
  window.__card = Object.assign(window.__card || {}, {
    duck(on) {
      if (on) {
        if (audio.paused) return;
        ducked = true; setPlaying(false);
        fadeVol(audio, 0, 500, () => audio.pause());
      } else if (ducked) {
        ducked = false;
        audio.play().then(() => { setPlaying(true); fadeVol(audio, .85, 1200); }).catch(() => {});
      }
    },
  });

  /* ── 給隱藏機關用 ── */
  window.__card = Object.assign(window.__card || {}, {
    envelopeDone: () => opened,
    envBack() {
      if (side !== "front") return;
      touched = true; clearInterval(peekTimer);
      card.style.transition = ""; card.style.transform = "";
      card.classList.add("flat");
      side = "back";
      riddle.classList.add("show");
      inkLoop();
    },
    skipEnvelope() {
      if (opened) return;
      opened = true;
      window.markOpened?.();
      riddle.classList.remove("show");
      stage.hidden = true;
      const fr = $("front"); fr.hidden = false;
      startMusic();   // 從機關的按鈕點進來，本身就是一次點擊，音樂可以直接播
    },
  });

  /* 對了：蠟封裂開，信封打開，日曆紙滑出來 */
  async function unlock() {
    if (opened) return;
    opened = true;
    window.markOpened?.();
    riddle.classList.remove("show");
    endNight();   // 如果正在播 9/19 的歌，淡出，換成向日葵
    seal.classList.add("glow");
    startMusic();
    await wait(600);
    ["half-l", "half-r"].forEach((cls) => {
      const half = inner.cloneNode(true);
      half.removeAttribute("id"); half.className = "half " + cls;
      half.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
      half.querySelectorAll("[tabindex]").forEach((n) => n.removeAttribute("tabindex"));
      seal.append(half);
    });
    inner.remove();
    requestAnimationFrame(() => requestAnimationFrame(() => seal.classList.add("split")));
    await wait(550);
    wrap.classList.add("flap-open");
    await wait(450);
    wrap.classList.add("flap-behind");
    await wait(500);
    wrap.classList.add("slide");
    await wait(1200);
    stage.classList.add("gone");
    let done = false;
    try { done = sessionStorage.getItem("cardDone") === "1"; } catch {}
    if (done) { await wait(500); stage.hidden = true; window.__card.letter(); return; }   // 已經看完了：直接回到信
    const front = $("front");
    front.hidden = false; front.classList.add("arrive");
    if (usedKeys) $("flower").focus({ preventScroll: true });
    await wait(900);
    stage.hidden = true;
  }

})();
</script>
<div class="jump" id="jump" hidden role="dialog" aria-modal="true" aria-labelledby="jumpTitle">
  <div class="jump-card">
    <h2 id="jumpTitle">跳到哪裡？</h2>
    <h3>魚雁之夢<small>信封</small></h3>
    <ol>
      <li><button data-go="back">信封背面・轉盤</button></li>
      <li><button data-go="matsuri"><span class="j-date">8/5</span>祭り</button></li>
      <li><button data-go="daiichiya"><span class="j-date">9/19</span>第一夜</button></li>
      <li><button data-go="room"><span class="j-date">9/21</span>花人局</button></li>
      <li><button data-go="pasdedeux"><span class="j-date">10/14</span>Pas de Deux</button></li>
      <li><button data-go="xmas"><span class="j-date">12/25</span>Merry Christmas</button></li>
    </ol>
    <h3>花之夢<small>卡片</small></h3>
    <ol>
      <li><button data-go="cover">向日葵封面</button></li>
      <li><button data-go="petals">花藏亡靈・從頭摘花瓣</button></li>
      <li><button data-go="heart">花瓣收完・點花心</button></li>
      <li><button data-go="hanabi">海の花火</button></li>
      <li><button data-go="cake">生日快樂・吹蠟燭</button></li>
      <li><button data-go="letter">信</button></li>
      <li><button data-go="review">花瓣翩翩・回頭看照片</button></li>
    </ol>
    <ol class="jump-misc">
      <li><button data-go="resetEggs">清空彩蛋紀錄</button></li>
    </ol>
    <button class="jump-close" id="jumpClose">關閉</button>
  </div>
</div>

<script>
/* ── 隱藏的跳轉選單：在鍵盤上打 hbd 就會出現（自己測試用） ── */
(() => {
  const $ = (id) => document.getElementById(id);
  const jump = $("jump");
  let lastFocus = null;
  function openJump() {
    if (!jump.hidden) return;
    lastFocus = document.activeElement;
    jump.hidden = false;
    jump.querySelector("[data-go]").focus();
  }
  function closeJump() {
    jump.hidden = true;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }

  let typed = "";
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !jump.hidden) return closeJump();
    if (e.key.length !== 1 || e.metaKey || e.ctrlKey || e.altKey) return;
    typed = (typed + e.key.toLowerCase()).slice(-3);
    if (typed === "hbd") { typed = ""; openJump(); }
  });
  $("jumpClose").addEventListener("click", closeJump);
  jump.addEventListener("click", (e) => { if (e.target === jump) closeJump(); });

  // 信封這邊的：翻到背面以後再進那個畫面
  const ENV = {
    back: () => {},
    matsuri: (C) => C.matsuri(),
    daiichiya: (C) => C.night("09-19"),
    room: (C) => C.room(),
    pasdedeux: (C) => C.night("10-14"),
    xmas: (C) => C.xmas(),
  };
  jump.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
    const go = b.dataset.go, C = window.__card;
    jump.hidden = true;
    if (go === "resetEggs") return window.resetEggs?.();
    if (go in ENV) {
      // 信封已經拆開的話，重新整理再翻到背面
      if (C.envelopeDone()) { try { sessionStorage.setItem("jumpTo", go); } catch {} return location.reload(); }
      C.envBack(); return ENV[go](C);
    }
    C.skipEnvelope();
    C[go]();
  }));

  // 重新整理後接著跳過去
  try {
    const j = sessionStorage.getItem("jumpTo");
    if (j in ENV) { sessionStorage.removeItem("jumpTo"); window.__card.envBack(); ENV[j](window.__card); }
  } catch {}
})();
</script>
</body>
</html>
