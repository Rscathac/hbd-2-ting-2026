<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ── 字體 ───────────────────────────────────────────── */
  /* LetterHand：由辰宇落雁體（SIL OFL 1.1，© 王莉宇、劉威辰）裁切而成的子集，
     依授權改名，授權全文見 fonts/OFL-ChenYuluoyan.txt。只留卡片用到的字，改了內容要重新裁一次 */
  @font-face {
    font-family: "LetterHand"; src: url("fonts/letterhand.woff2") format("woff2");
    size-adjust: 122%;  /* 這套字本身偏小 */
    font-display: swap;
  }

  /* ── tokens ─────────────────────────────────────────── */
  :root {
    --sky:      #E7EFEA;  /* 清晨的天色，淡薄荷 */
    --sky-deep: #D3E2DA;
    --petal:    #F6C343;
    --petal-hi: #FADB72;
    --petal-lo: #E89B2B;
    --seed:     #4A2E1A;
    --leaf:     #8DA77B;
    --ink:      #3B2E25;
    --ink-soft: #6E5F52;

    --display: "Shippori Mincho B1", "LXGW WenKai TC", serif;  /* 日曆上的數字也用標題字體，全站只用兩套字 */
    --title:   "Shippori Mincho B1", "LXGW WenKai TC", serif;
    --body:    "LetterHand", "LXGW WenKai TC", "PingFang TC", serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* 紙張紋理 + 晨光水彩暈染 */
  body::before {
    content: ""; position: fixed; inset: -80px; pointer-events: none; z-index: 0;
    background:
      radial-gradient(42vmax 34vmax at 78% 8%,  rgba(250,219,114,.55), transparent 70%),
      radial-gradient(36vmax 30vmax at 8% 92%,  rgba(141,167,123,.30), transparent 70%),
      radial-gradient(30vmax 24vmax at 96% 88%, rgba(246,195,67,.18),  transparent 70%);
    filter: url(#wash);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: .38; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .30  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ── 封面 ─────────────────────────────────────────── */
  .front {
    position: relative; z-index: 2;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(16px, 4vw, 40px);
  }
  .front[hidden] { display: none; }

  /* 日曆的一頁 */
  .leaf-cal {
    display: flex; align-items: flex-end; gap: 14px;
    color: var(--ink);
  }
  .leaf-cal .day {
    font-family: var(--display);
    font-size: clamp(64px, 12vw, 112px);
    line-height: .8;
    letter-spacing: -.02em;
    color: var(--petal-lo);
  }
  .leaf-cal .meta {
    display: grid; gap: 2px; padding-bottom: 4px;
    font-size: 14px; letter-spacing: .12em; color: var(--ink-soft);
  }
  .leaf-cal .meta b {
    font-family: var(--display); font-weight: 700;
    font-size: 18px; letter-spacing: .18em; color: var(--ink);
  }
  .greeting {
    margin-top: 18px;
    font-family: var(--title); font-weight: 700;
    font-size: clamp(22px, 3.4vw, 30px);
    color: var(--ink);
  }
  .greeting span { display: block; font-family: var(--body); font-size: .62em; color: var(--ink-soft); margin-top: 6px; letter-spacing: .08em; }

  .stage {
    position: relative;
    display: grid; place-items: center;
    min-height: 0;
  }
  .flower-btn {
    position: relative;
    width: min(86vw, 62svh, 560px);
    aspect-ratio: 1;
    background: none; border: 0; padding: 0; cursor: pointer;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }
  .flower-btn:focus-visible { outline: 3px dashed var(--petal-lo); outline-offset: 10px; }
  .flower-btn svg { width: 100%; height: 100%; overflow: visible; display: block; }

  .head { transform-box: view-box; transform-origin: 0 0; animation: sway 7s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2.4deg); } }

  .petal {
    transform-box: view-box; transform-origin: 0 0;
    transform: rotate(var(--a)) translateY(var(--r));
    transition: transform 1.1s cubic-bezier(.2,.7,.2,1), opacity .9s ease;
    transition-delay: var(--d, 0s);
  }
  .seed { transform-box: view-box; transform-origin: 0 0; transition: transform 1s cubic-bezier(.5,0,.2,1), opacity .8s ease; transition-delay: var(--d, 0s); }

  .flower-btn:hover .petal:nth-child(odd) { transform: rotate(var(--a)) translateY(calc(var(--r) - 4px)); }

  .hint[hidden] { display: none; }
  .hint {
    display: flex; justify-content: flex-end; align-items: flex-end; gap: 6px;
    width: 50%; padding: 8px 26px 0 0;  /* 寫在花莖左邊，不壓到莖 */
    font-size: 17px; color: var(--ink-soft);
    transform: rotate(-2deg);
  }
  .arrow { width: 50px; height: 38px; flex: none; fill: none; stroke: var(--ink-soft); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* 綻放中 */
  .opening .head { animation-play-state: paused; }
  .opening .petal {
    transform: rotate(calc(var(--a) + var(--spin))) translateY(calc(var(--r) - 190px)) scale(.7);
    opacity: 0;
  }
  .opening .seed { transform: scale(1.35); }
  .opening .hint, .opening .leaf-cal, .opening .greeting, .opening .stem { opacity: 0; transition: opacity .5s ease; }

  /* 花心放大，接到內頁 */
  .bloom {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      radial-gradient(circle at var(--cx, 50%) var(--cy, 50%), #6B6A2A 0 6%, #5A3A22 22%, var(--seed) 60%);
    clip-path: circle(0 at var(--cx, 50%) var(--cy, 50%));
    transition: clip-path .9s cubic-bezier(.6,0,.2,1), opacity .7s ease .1s;
  }
  .bloom.grow { clip-path: circle(150% at var(--cx, 50%) var(--cy, 50%)); }
  .bloom.fade { opacity: 0; }

  /* ── 內頁：那張日曆紙的背面 ─────────────────────── */
  .inside {
    position: relative; z-index: 2;
    max-width: 1120px; margin: 0 auto;
    padding: clamp(40px, 7vw, 80px) 20px 100px;
  }
  .inside[hidden] { display: none; }
  .inside:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* 正面的日期從紙背透過來 */
  .ghost {
    position: absolute; top: 0; right: 3%;
    font-family: var(--display); font-size: clamp(200px, 36vw, 440px); line-height: 1;
    color: var(--petal-lo); opacity: .07;
    transform: scaleX(-1); pointer-events: none; user-select: none;
  }

  /* 第一段：只有花。花瓣摘完，第二段的信才出現 */
  .petal-stage {
    position: relative; min-height: calc(100svh - 120px);
    display: grid; justify-items: center; align-content: center; gap: 14px;
  }
  .petal-stage .diary { justify-self: start; }
  .stage-note { justify-content: center; text-align: center; transform: rotate(-1.5deg); transition: opacity .6s; }
  .pflower { width: min(100%, 680px); }
  .tally { list-style: none; margin: 0; padding: 0; display: flex; gap: 9px; }
  .tally[hidden] { display: none; }
  .tally li {
    width: 11px; height: 24px; border: 1.5px solid var(--petal-lo);
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    transition: background .5s ease, transform .5s cubic-bezier(.3,1.6,.5,1);
  }
  .tally li.got { background: var(--petal); transform: translateY(-3px) rotate(-6deg); }
  .letter-sec { max-width: 760px; margin: 40px auto 0; padding-top: 40px; }
  .letter-sec[hidden] { display: none; }
  .letter-sec.reveal > * { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .letter-sec.reveal > *:nth-child(3) { animation-delay: .15s; }
  .letter-sec.reveal > *:nth-child(4) { animation-delay: .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  /* 花瓣都收完：花心一明一暗，等人去點 */
  .disc-core { outline: none; }
  .pflower.done .disc-core { cursor: pointer; animation: corePulse 1.8s ease-in-out infinite; }
  .pflower.done .disc-core:focus-visible { animation: none; filter: drop-shadow(0 0 0 3px #E89B2B) drop-shadow(0 0 16px rgba(246,195,67,.9)); }
  @keyframes corePulse { 50% { filter: drop-shadow(0 0 22px rgba(246,195,67,.9)); } }
  .pflower.burst .disc-core { opacity: 0; transition: opacity .12s; }
  .pflower .pp.back-in { animation: backIn .7s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes backIn { from { opacity: 0; } }
  .petal-stage[hidden] { display: none; }
  .back-row { margin: 8px 0 0; }
  .back-row[hidden] { display: none; }
  .seed-burst { position: absolute; inset: 0; width: 100%; height: 100%; }
  .secret-seed { cursor: pointer; outline: none; }
  .secret-seed .heart { transform-box: fill-box; transform-origin: center; animation: glint 7s ease-in-out infinite; }
  .secret-seed:hover .heart, .secret-seed:focus-visible .heart { animation: none; fill: #FADB72; filter: drop-shadow(0 0 4px rgba(250,219,114,.9)); }
  @keyframes glint { 0%, 88%, 100% { fill: #D9A441; filter: none; transform: scale(1); }
                     93% { fill: #FBE3A6; filter: drop-shadow(0 0 5px rgba(250,219,114,1)); transform: scale(1.35); } }
  .diary { font-size: 15px; color: var(--ink-soft); letter-spacing: .04em; }
  .inside h1 {
    font-family: var(--title); font-weight: 700;
    font-size: clamp(30px, 4.6vw, 46px); line-height: 1.35; letter-spacing: .02em;
    margin: 10px 0 18px;
  }
  .inside h1 .to { color: var(--petal-lo); }
  /* 日文明朝體的逗號句號會擠在左下角，標點改用繁中字體 */
  .inside h1 .pu { font-family: "LXGW WenKai TC", serif; font-weight: 400; }

  /* 信紙的橫線跟著行高走 */
  .letter {
    --lh: 2.15em;
    max-width: 30em;
    font-size: clamp(18px, 2vw, 20px);
    line-height: var(--lh);
    background: linear-gradient(transparent calc(var(--lh) - 1px), rgba(141,167,123,.4) 0) 0 0 / 100% var(--lh);
  }
  .letter p { margin: 0; padding-left: 1em; text-indent: -1em; }   /* 換行的部分內縮一格 */
  #title:focus { outline: none; }
  .letter .sign { display: block; text-align: right; color: var(--ink-soft); }

  .scribble {
    display: flex; align-items: flex-end; gap: 6px;
    font-size: 17px; line-height: 1.6; color: var(--ink-soft);
  }


  @media (min-width: 900px) {

  }

  /* 照片向日葵：一片花瓣一張照片 */
  .pflower svg { width: min(100%, 64svh); height: auto; overflow: visible; display: block; margin: 0 auto; }

  .pp {
    transform-box: view-box; transform-origin: 0 0;
    transform: rotate(var(--a)) scale(.15);
    opacity: 0;
    transition: transform .9s cubic-bezier(.2,.8,.25,1.15), opacity .5s ease;
    transition-delay: var(--d);
    cursor: pointer; outline: none;
  }
  .pflower.unfurl .pp { transform: rotate(var(--a)); opacity: 1; }
  .pflower .pp.plucked { opacity: 0 !important; pointer-events: none; transition: opacity .15s; }
  .pp.empty { cursor: default; }
  .pflower.unfurl .pp.empty { opacity: .9; }
  .pflower.unfurl .pp:not(.empty):hover,
  .pflower.unfurl .pp:not(.empty):focus-visible { transform: rotate(var(--a)) translateY(-10px); transition-delay: 0s; transition-duration: .35s; }
  .pp .rim { transition: stroke-width .25s; }
  .pp:focus-visible .rim { stroke: var(--ink); stroke-width: 4; stroke-dasharray: 6 5; }

  .bp { transform-box: view-box; transform-origin: 0 0; transform: rotate(var(--a)) scale(.2); opacity: 0;
        transition: transform 1s cubic-bezier(.2,.8,.25,1), opacity .6s ease; transition-delay: var(--d); }
  .pflower.unfurl .bp { transform: rotate(var(--a)); opacity: 1; }

  /* 放大看照片 */
  .lightbox {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; align-content: center; gap: 18px;
    padding: 16px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .30  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), var(--sky);
    opacity: 0; transition: opacity .35s ease;
  }
  .lightbox[hidden] { display: none; }
  .lightbox.on { opacity: 1; }
  .lb-month { font-family: var(--title); font-weight: 700; font-size: clamp(26px, 4vw, 38px); margin: 0; letter-spacing: .04em; transition: color 1.6s; }
  /* 點燃仙女棒：天色暗下來 */
  .lightbox::before { content: ""; position: absolute; inset: 0; background: #17120f; opacity: 0; transition: opacity 1.8s ease; pointer-events: none; }
  .lightbox.dusk::before { opacity: .93; }
  .lightbox > * { position: relative; }
  .lightbox.dusk .lb-month { color: #EFE3C6; }
  .lightbox.dusk .keep-btn { color: #E9D9B8; }
  .lb-card { transition: transform .45s cubic-bezier(.2,.8,.25,1), width 1.1s cubic-bezier(.4,0,.2,1); }
  .sparkler { display: grid; justify-items: center; gap: 0; margin: -8px 0 -6px; max-height: 260px; overflow: visible;
              transition: opacity .7s ease, max-height 1.1s cubic-bezier(.4,0,.2,1), margin 1.1s cubic-bezier(.4,0,.2,1); }
  .sparkler[hidden] { display: none; }
  .sparkler.gone { opacity: 0; max-height: 0; margin: 0 0 -18px; pointer-events: none; }
  /* 只有新加進來的那支慢慢長出來；第一支不動 */
  .lb-photos.growing .new { transition: flex-grow 1.1s cubic-bezier(.4,0,.2,1), max-height 1.1s cubic-bezier(.4,0,.2,1), opacity 1.1s ease; }
  .spark-btn { border: 0; background: none; padding: 0; cursor: pointer; width: min(86vw, 420px); aspect-ratio: 420 / 190; }
  .spark-btn canvas { width: 100%; height: 100%; display: block; }
  .spark-btn:focus-visible { outline: 2px dashed var(--petal-lo); outline-offset: 4px; }
  .spark-hint { margin: -14px 0 0; font-size: 16px; color: var(--ink-soft); transition: opacity .6s; }
  .lb-photos video.arrive, .lb-photos img.arrive { animation: arriveVid 1.4s ease both; }
  @keyframes arriveVid { from { opacity: 0; transform: scale(.94); } }
  .lb-card {
    width: min(100%, 560px);
    background: #FBFCF8; padding: 14px 14px 16px;
    box-shadow: 0 30px 60px -30px rgba(59,46,37,.55);
    transform: rotate(-1.2deg) scale(.96);
  }
  .lightbox.on .lb-card { transform: rotate(-1.2deg); }
  .lb-photos { display: flex; gap: 8px; }
  .lb-photos[hidden] { display: none; }
  .lb-photos img, .lb-photos video { display: block; width: 100%; min-width: 0; max-height: 62svh; object-fit: contain; background: var(--sky-deep); }
  .lb-photos video { cursor: pointer; }
  /* 一對：照比例分寬度，高度對齊 */
  .lb-card.has-pair { width: min(100%, 820px); }
  .lb-photos.pair img, .lb-photos.pair video { flex: var(--ar, 1) 1 0; aspect-ratio: var(--ar, 1); height: auto; max-height: none; object-fit: cover; }
  @media (max-width: 600px) {
    .lb-photos.pair.landscape { flex-direction: column; align-items: center; }
    .lb-photos.pair.landscape img, .lb-photos.pair.landscape video { flex: none; width: auto; max-width: 100%; height: auto; max-height: calc(62svh / var(--n, 2)); aspect-ratio: auto; object-fit: contain; background: none; }
  }
  .lb-empty { margin: 0; padding: 70px 16px; text-align: center; color: var(--ink-soft); font-size: 18px; background: var(--sky-deep); }
  .lb-empty[hidden] { display: none; }
  .lb-card figcaption { margin-top: 12px; font-size: 19px; text-align: center; min-height: 1em; }
  .lb-card figcaption.seed-words { display: grid; gap: 4px; margin-top: 14px; opacity: 0; transform: translateY(6px); transition: opacity 1.6s ease, transform 1.6s ease; }
  .lb-card figcaption.seed-words.in { opacity: 1; transform: none; }
  .seed-words .seed-title, .seed-words .seed-cap { font-family: var(--body); font-weight: 400; font-size: 19px; letter-spacing: .04em; color: var(--ink); }
  .lb-card figcaption:empty { display: none; }
  .lb-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .lb-nav[hidden] { display: none; }
  .lb-count { font-family: var(--title); font-size: 14px; color: var(--ink-soft); }
  .lb-btn {
    font: inherit; font-size: 16px; color: var(--ink-soft);
    background: none; border: 0; padding: 8px 4px; cursor: pointer;
  }
  .lb-btn:hover { color: var(--ink); text-decoration: underline wavy var(--petal-lo); text-underline-offset: 6px; }
  .lb-btn:focus-visible { outline: 2px dashed var(--petal-lo); outline-offset: 2px; }
  .keep-btn {
    font: inherit; font-size: 18px; color: var(--ink); cursor: pointer;
    background: none; border: 0; padding: 8px 4px;
    text-decoration: underline wavy var(--petal-lo); text-underline-offset: 8px; text-decoration-thickness: 1.5px;
  }
  .keep-btn:hover { color: var(--petal-lo); }
  .keep-btn:focus-visible { outline: 2px dashed var(--petal-lo); outline-offset: 6px; }

  /* 花瓣飛向鏡頭 */
  .fly-layer { position: fixed; inset: 0; z-index: 11; pointer-events: none; perspective: 1000px; }
  .fly { position: absolute; transform-style: preserve-3d; will-change: transform, opacity; }
  .fly svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 18px 18px rgba(59,46,37,.25)); }

  .close-row { margin-top: 88px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 40px; }
  .close-btn {
    font: inherit; font-size: 18px; color: var(--ink);
    background: none; border: 0; padding: 8px 4px; cursor: pointer;
    text-decoration: underline wavy var(--petal-lo); text-underline-offset: 8px; text-decoration-thickness: 1.5px;
  }
  .close-btn:hover { color: var(--petal-lo); }
  .close-btn:focus-visible { outline: 2px dashed var(--petal-lo); outline-offset: 6px; }


  /* ── 信封：台北寄到巴黎，燭光下拆蠟封 ─────────────── */
  .env-stage {
    position: fixed; inset: 0; z-index: 8;
    display: grid; place-items: center; align-content: center; gap: 22px;
    padding: 16px;
    background: #2A2019;
    overflow: hidden; touch-action: none;
    transition: opacity .9s ease;
  }
  .env-stage[hidden] { display: none; }
  .env-stage.gone { opacity: 0; pointer-events: none; }
  .candle {
    position: absolute; inset: 0; z-index: 20; pointer-events: none;
    --mx: 50vw; --my: 45vh;
    background: radial-gradient(circle 300px at var(--mx) var(--my),
      rgba(255,210,130,.10) 0%, rgba(42,32,25,.12) 38%, rgba(26,19,15,.78) 72%, rgba(20,15,12,.94) 100%);
    /* 只動透明度：交給 GPU，不用每一格重畫整個畫面 */
    animation: flicker 3.4s ease-in-out infinite;
  }
  @keyframes flicker { 0%,100% { opacity: 1; } 28% { opacity: .95; } 52% { opacity: 1; } 76% { opacity: .96; } }

  .env-wrap {
    position: relative; z-index: 1;
    width: min(92vw, 600px); aspect-ratio: 1.32;
    perspective: 1600px;
  }
  .env-card { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 3px;
    box-shadow: 0 34px 60px -24px rgba(0,0,0,.7);
  }
  .face-back { transform: rotateY(180deg); }
  /* 翻完之後拿掉 3D，裡面的信封蓋才好做自己的翻轉 */
  .env-card.flat { transform: none; transition: none; transform-style: flat; will-change: auto; }
  .env-card.flat .face-front { display: none; }
  .env-card.flat .face-back { transform: none; backface-visibility: visible; -webkit-backface-visibility: visible; }

  /* 正面：航空信封 */
  .face-front {
    border: 0; padding: 10px; margin: 0; font: inherit; color: var(--ink); text-align: left;
    cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none;
    background: repeating-linear-gradient(135deg, #F2B93B 0 16px, #F4F7F1 16px 26px, #8DA77B 26px 42px, #F4F7F1 42px 52px);
  }
  .face-front:active { cursor: grabbing; }
  .face-front:focus-visible { outline: 3px dashed var(--petal-hi); outline-offset: 6px; }
  .env-paper { position: absolute; inset: 10px; border-radius: 2px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .30  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), #EEF3EE; }
  .par-avion {
    position: absolute; top: 8%; left: 6%;
    border: 1.5px solid #6F8C5E; color: #5F7A52; padding: 3px 9px 2px;
    font-family: var(--title); font-weight: 500; font-size: 12px; letter-spacing: .2em;
    transform: rotate(-3deg);
  }
  .par-avion small { font-family: var(--body); font-size: 13px; letter-spacing: .08em; margin-left: 4px; }
  .env-from { position: absolute; top: 22%; left: 6%; display: grid; gap: 2px; font-size: 15px; }
  .latin { font-family: var(--title); font-weight: 500; font-size: 11px; letter-spacing: .22em; color: var(--ink-soft); }
  .stamp {
    position: absolute; top: 8%; right: 6%; width: 15%; aspect-ratio: .8;
    background: #FBFCF8; padding: 5px;
    outline: 4px dotted #FBFCF8; outline-offset: -1px;
    transform: rotate(2deg);
    box-shadow: 0 2px 4px rgba(0,0,0,.12);
  }
  .stamp-art { position: relative; height: 100%; background: #DCE8DF; display: grid; place-items: center; overflow: hidden; }
  .stamp-art svg { width: 78%; }
  .stamp-art .val { position: absolute; top: 3px; left: 5px; font-family: var(--title); font-weight: 700; font-size: 10px; color: var(--ink); }
  .stamp-art .cty { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-family: var(--title); font-weight: 700; font-size: 7px; letter-spacing: .2em; }
  .postmark { position: absolute; top: 4%; right: 12%; width: 30%; transform: rotate(-12deg); opacity: .62; pointer-events: none; }
  .env-to { position: absolute; left: 36%; top: 47%; right: 8%; display: grid; gap: 8px; }
  .env-to > span { border-bottom: 1px solid rgba(59,46,37,.22); padding-bottom: 4px; }
  .env-to .big { font-size: clamp(22px, 3.6vw, 30px); }
  .env-to .city { font-size: 18px; }
  .env-to .to-label { font-family: var(--title); font-weight: 500; font-size: .62em; color: var(--ink-soft); margin-right: .5em; letter-spacing: .06em; }

  /* 背面：信封口、蠟封、裡面那張日曆紙 */
  .face-back { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .30  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), #E4EBE3; }
  .paper-inside {
    position: absolute; left: 5%; right: 5%; top: 4%; bottom: 5%; z-index: 1;
    background: var(--sky); border-radius: 2px; padding: 5% 6%;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    transition: transform 1.1s cubic-bezier(.3,.7,.2,1);
  }
  .paper-inside .mini-day { font-family: var(--display); font-size: clamp(34px, 6vw, 52px); line-height: .8; color: var(--petal-lo); }
  .paper-inside .mini-meta { font-family: var(--display); font-size: 11px; letter-spacing: .2em; margin-top: 6px; }
  .paper-inside svg { position: absolute; right: 8%; top: 10%; width: 30%; }
  .pocket { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; }
  .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 61%; z-index: 4;  /* 要比袋口深一點，才不會從縫看到裡面 */
    transform-origin: top center;
    transition: transform .9s cubic-bezier(.4,.1,.2,1);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.18));
  }
  .flap svg { width: 100%; height: 100%; display: block; }
  .env-wrap.flap-open .flap { transform: rotateX(180deg); }
  .env-wrap.flap-behind .flap { z-index: 0; }
  .env-wrap.slide .paper-inside { transform: translateY(-60%); }

  /* 隱形墨水：燭光照到才看得見 */
  .ink {
    position: absolute; top: 9%; left: 8%; right: 8%;
    text-align: center; font-family: var(--body); font-size: clamp(16px, 2.3vw, 20px); color: #94631F;
    -webkit-mask-image: radial-gradient(circle 120px at var(--hx, -999px) var(--hy, -999px), #000 0%, rgba(0,0,0,.55) 45%, transparent 78%);
            mask-image: radial-gradient(circle 120px at var(--hx, -999px) var(--hy, -999px), #000 0%, rgba(0,0,0,.55) 45%, transparent 78%);
  }
  .ink.revealed { -webkit-mask-image: none; mask-image: none; animation: inkIn 1.4s ease both; }
  @keyframes inkIn { from { opacity: .35; } to { opacity: 1; } }
  .env-wrap.flap-open .ink { opacity: 0; transition: opacity .2s; }

  /* 蠟封轉盤 */
  .seal {
    position: absolute; left: 50%; top: 56%; z-index: 5;
    width: clamp(180px, 40%, 236px); aspect-ratio: 1;
    translate: -50% -50%;
    touch-action: none;
  }
  .seal-inner, .half { position: absolute; inset: 0; }
  .seal-inner svg, .half svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
  /* 蠟本身（有紋理濾鏡和陰影）是靜態的一層，轉盤轉的時候不用重畫 */
  .seal-wax { filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); transition: filter .4s; }
  .seal.glow .seal-wax { filter: drop-shadow(0 0 18px rgba(246,195,67,.85)); }
  .seal-ring { will-change: transform; transform-origin: 50% 50%; cursor: grab; outline: none; }
  .seal-ring.snap { transition: transform .28s cubic-bezier(.3,.7,.3,1.2); }
  .seal-ring:focus-visible .ring-hit { stroke: rgba(250,219,114,.55); stroke-width: 2; stroke-dasharray: 5 5; }
  .lbl { font-family: var(--title); font-weight: 700; fill: rgba(250,225,185,.62); }
  .lbl.on { fill: #FBE3A6; }
  .half { transition: transform 1.1s cubic-bezier(.4,0,.6,1), opacity 1s ease .2s; }
  .half-l { clip-path: polygon(0 0, 51.7% 0, 47.5% 24.2%, 53.75% 45%, 47.1% 65.8%, 53.3% 88.3%, 48.75% 100%, 0 100%); }
  .half-r { clip-path: polygon(51.7% 0, 100% 0, 100% 100%, 48.75% 100%, 53.3% 88.3%, 47.1% 65.8%, 53.75% 45%, 47.5% 24.2%); }
  .seal.split .half-l { transform: translate(-19%, 38%) rotate(-28deg); opacity: 0; }
  .seal.split .half-r { transform: translate(19%, 40%) rotate(24deg); opacity: 0; }

  .riddle {
    position: relative; z-index: 21;
    max-width: 30em; min-height: 3.6em; margin: 0;
    text-align: center; white-space: pre-line;
    font-size: clamp(17px, 2.2vw, 20px); line-height: 1.8; letter-spacing: .08em; color: #E9D9B8;
    opacity: 0; transition: opacity 2.4s ease .6s;
  }
  .riddle.show { opacity: .92; }
  .riddle {
    -webkit-mask-image: radial-gradient(circle 150px at var(--hx, -999px) var(--hy, -999px), #000 0%, rgba(0,0,0,.6) 45%, transparent 80%);
            mask-image: radial-gradient(circle 150px at var(--hx, -999px) var(--hy, -999px), #000 0%, rgba(0,0,0,.6) 45%, transparent 80%);
  }
  .riddle.quick { transition: opacity .48s ease; }
  .riddle.show.swap { opacity: 0; }
  /* 轉到彩蛋的日子：蠟封像轉錯的鎖一樣晃兩下 */
  .seal.nope .seal-inner { animation: nope 1s cubic-bezier(.36,.07,.19,.97); }
  @keyframes nope {
    0%, 100% { transform: translateX(0) rotate(0); }
    10% { transform: translateX(-12px) rotate(-9deg); }
    25% { transform: translateX(11px) rotate(8deg); }
    40% { transform: translateX(-10px) rotate(-7deg); }
    55% { transform: translateX(8px) rotate(5deg); }
    70% { transform: translateX(-4px) rotate(-2deg); }
    85% { transform: translateX(2px) rotate(1deg); }
  }
  .seal.nope .seal-wax { animation: nopeDim 1s ease; }
  @keyframes nopeDim { 20%, 70% { filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)) brightness(.62); } }
  .seal.nope .marker path { animation: nopeMark 1s steps(1, end); }
  @keyframes nopeMark { 0%, 40% { fill: #C4553D; } 20%, 60% { fill: #6E2A1C; } 80%, 100% { fill: #F2B93B; } }

  /* 9/19：歌詞一句一句滲出來，放在信封下面（原本那句詩的位置），不蓋住信封 */
  .night-poem {
    position: absolute; left: 0; right: 0; z-index: 22; pointer-events: none;
    display: flex; justify-content: center; padding: 0 16px;
    opacity: 0; transition: opacity 1.4s ease;
  }
  .night-poem[hidden] { display: none; }
  .night-poem.on { opacity: 1; }
  .night-poem .cols {
    text-align: center;
    font-family: var(--title); font-weight: 500; font-size: clamp(15px, 1.8vw, 18px);
    line-height: 1.75; letter-spacing: .16em; color: #EFE3C6;
    text-shadow: 0 0 14px rgba(246,195,67,.28);
  }
  .night-poem p { margin: 0; position: relative; }
  .night-poem .jp { transition: opacity .5s ease; }
  .night-poem .zh {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; white-space: nowrap;
    font-family: var(--body); font-weight: 400; letter-spacing: .1em; color: #F6D98A;
    opacity: 0; transition: opacity .5s ease;
  }
  .night-poem p.lit .jp { opacity: 0; }
  .night-poem p.lit .zh { opacity: 1; }
  .night-poem .ch { opacity: 0; filter: blur(5px); animation: inkSeep 1.5s ease forwards; animation-delay: var(--t); }
  @keyframes inkSeep { to { opacity: 1; filter: blur(0); } }

  /* 9/21：信封淡出，換成一間房間；燭光（.candle）照到哪裡就看得見哪裡 */
  .env-stage.in-room .env-wrap { opacity: 0; pointer-events: none; transition: opacity 1.6s ease; }
  .env-stage.in-room .riddle { opacity: 0 !important; }
  .room {
    position: absolute; left: 50%; top: 50%; z-index: 10;
    width: min(94vw, 880px, 150svh); aspect-ratio: 8 / 5; translate: -50% -50%;
    opacity: 0; transition: opacity 2s ease .4s;
  }
  .room[hidden] { display: none; }
  .room.on { opacity: 1; }
  .room svg { width: 100%; height: 100%; display: block; overflow: hidden; }
  /* 兩面牆：拖曳轉身。沒在看的那面放在旁邊、看不到 */
  .room-views { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
  .room-views:active { cursor: grabbing; }
  .room .exit-door { cursor: pointer; }
  .room svg .books, .room svg .poster, .room svg .mirror { cursor: pointer; }
  .room svg .ref { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transition: opacity 1.6s ease, transform 2.4s ease, filter 1.6s ease; filter: blur(3px); }
  .room svg .mirror.show .ref { opacity: .8; filter: blur(.4px); }
  .room svg .mirror.gone .ref-woman { opacity: 0; transform: translateY(-6px); filter: blur(4px); transition: opacity 2.6s ease, transform 2.6s ease, filter 2.6s ease; }
  .room svg .mirror.fade .ref-man { opacity: 0; filter: blur(3px); transition: opacity 2.6s ease, filter 2.6s ease; }
  .room svg .ref-dust circle { opacity: 0; }
  .room svg .mirror.gone .ref-dust circle { animation: dustUp 2.6s ease-out var(--dd) both; }
  @keyframes dustUp { 20% { opacity: .9; } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .room svg .ref-glint { opacity: 0; }
  .room svg .mirror.glint .ref-glint { animation: glintSweep 1.3s ease-in-out; }
  @keyframes glintSweep { 0% { opacity: 0; transform: skewX(-18deg) translateX(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: skewX(-18deg) translateX(440px); } }
  .room svg .note { font-size: 16px; fill: #F3DFB2; pointer-events: none; animation: noteUp 2.4s ease-out forwards; }
  @keyframes noteUp { from { opacity: 0; transform: translate(0, 0); } 15% { opacity: .95; } to { opacity: 0; transform: translate(var(--nx), -70px); } }
  .bear-say { opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity .4s ease, transform .6s ease;
              filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .bear-say text { font-family: var(--body); font-size: 15px; fill: #3B2E25; }
  .bear-say.on { opacity: 1; transform: none; }
  .room-view { position: absolute; inset: 0; will-change: transform; }
  /* 電腦螢幕、電視：點了才亮 */
  .screen { position: absolute; overflow: hidden; background: #0E0F14; opacity: 0; transition: opacity .9s ease, box-shadow .9s ease; cursor: pointer; }
  .screen.on { opacity: 1; box-shadow: 0 0 18px 4px rgba(170,200,255,.25); }
  .screen img, .screen video { display: block; width: 100%; height: 100%; }
  .screen img { object-fit: cover; object-position: 50% 30%; }
  .screen video { object-fit: cover; background: #000; }
  .screen-pc { left: 29.105%; top: 54.328%; width: 16.1%; height: 13.984%; }
  .screen-tv { left: 50.015%; top: 56.168%; width: 18.63%; height: 16.192%; }
  .screen.flicker { animation: flicker .5s steps(2) 2; }
  @keyframes flicker { 50% { filter: brightness(2.2) contrast(.6); } }
  /* 點開放大 */
  .room-zoom { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 3%;
               background: rgba(14,11,9,.82); opacity: 0; transition: opacity .5s ease; cursor: zoom-out; }
  .room-zoom[hidden] { display: none; }
  .room-zoom.on { opacity: 1; }
  .room-zoom figure { margin: 0; background: #FBFCF8; padding: 10px 10px 12px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.7); transform: rotate(-1.5deg); max-height: 100%; }
  .room-zoom img, .room-zoom video { display: block; max-width: 100%; max-height: calc(min(90vw, 880px, 150svh) * .5); object-fit: contain; background: #111; }
  .room-zoom figcaption { margin-top: 8px; text-align: center; font-size: 15px; color: var(--ink); }
  .room-zoom .empty { width: 220px; aspect-ratio: 4/5; display: grid; place-items: center; background: #ECE8E0; color: var(--ink-soft); font-size: 15px; }

  /* 12/25：聖誕樹 */
  .env-stage .xmas {
    position: absolute; left: 50%; top: 50%; z-index: 10;
    width: min(94vw, 880px, 150svh); aspect-ratio: 8 / 5; translate: -50% -50%;
    opacity: 0; transition: opacity 2s ease .4s;
  }
  .xmas[hidden] { display: none; }
  .env-stage.xmas-mode .candle { opacity: 0; transition: opacity 1.2s ease; }
  .xmas::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                 background: radial-gradient(ellipse 58% 70% at 50% 55%, transparent 35%, rgba(12,9,7,.55) 100%); }
  .xmas .yr { font-family: var(--title); font-weight: 700; font-size: 7px; fill: #5A4636; }
  .room-zoom .gal { display: flex; align-items: center; gap: 10px; }
  .room-zoom .gal-btn { font: inherit; font-size: 30px; color: #F3DFB2; background: none; border: 0; cursor: pointer; padding: 8px; }
  .room-zoom .gal-btn[hidden] { visibility: hidden; display: block; }
  .room-zoom .gal-btn:focus-visible { outline: 2px dashed var(--petal-lo); }
  .xmas.on { opacity: 1; }
  .xmas svg { width: 100%; height: 100%; display: block; }
  .xmas .bulb { animation: twinkle 1.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes twinkle { 50% { opacity: .25; } }
  .xmas .star { animation: starGlow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes starGlow { 50% { filter: drop-shadow(0 0 10px rgba(255,214,120,.95)); transform: scale(1.06); } }
  .xmas .ornament { cursor: pointer; transform-box: fill-box; transform-origin: 50% 0; animation: sway2 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .xmas .ornament:hover { filter: drop-shadow(0 0 6px rgba(255,230,170,.9)); }
  @keyframes sway2 { 50% { transform: rotate(4deg); } }
  /* 8/5：夏祭り */
  .env-stage .matsuri {
    position: absolute; left: 50%; top: 50%; z-index: 10;
    width: min(94vw, 880px, 150svh); aspect-ratio: 8 / 5; translate: -50% -50%;
    opacity: 0; transition: opacity 2s ease .4s;
  }
  .matsuri[hidden] { display: none; }
  .matsuri.on { opacity: 1; }
  .env-stage.matsuri-mode .candle { opacity: 0; transition: opacity 1.2s ease; }
  .matsuri > svg { width: 100%; height: 100%; display: block; }
  .matsuri .lamp { opacity: .22; transition: opacity .7s ease; }
  .matsuri .halo { opacity: 0; transition: opacity .9s ease; }
  .matsuri.lit .lamp, .matsuri.lit .halo { opacity: 1; transition-delay: var(--d); }
  .matsuri .lantern > g { transform-box: fill-box; transform-origin: 50% 0; }
  .matsuri.sway .lantern > g { animation: lanternSway 1.3s ease-in-out; }
  @keyframes lanternSway { 25% { transform: rotate(6deg); } 60% { transform: rotate(-3deg); } }
  .matsuri .stall, .matsuri .drum-g, .matsuri .her { cursor: pointer; outline: none; }
  .matsuri .stall:hover, .matsuri .stall:focus-visible { filter: brightness(1.15); }
  .matsuri .fish { animation: fishSwim var(--t) ease-in-out infinite alternate; animation-delay: var(--d); }
  @keyframes fishSwim { to { transform: translateX(var(--s)); } }
  .matsuri .her-body { transition: none; }
  .matsuri .her.walk .her-body { animation: herBob .42s ease-in-out infinite; }
  @keyframes herBob { 50% { transform: translateY(-2.5px) rotate(.6deg); } }
  .matsuri .her.hop .her-body { animation: herHop .5s ease; }
  @keyframes herHop { 40% { transform: translateY(-9px); } }
  .matsuri .her-ame, .matsuri .her-bag { opacity: 0; transition: opacity .6s ease; }
  .matsuri .her.has-ame .her-ame, .matsuri .her.has-kingyo .her-bag { opacity: 1; }
  .matsuri .heart-pop { transform-box: fill-box; transform-origin: center; animation: heartPop 1.4s ease-out forwards; }
  @keyframes heartPop { from { opacity: 1; transform: translateY(0) scale(.6); } to { opacity: 0; transform: translateY(-40px) scale(1.3); } }
  .matsuri .drum-g { transform-box: fill-box; transform-origin: center; }
  .matsuri .drum-g.hit { animation: drumHit .28s ease; }
  @keyframes drumHit { 40% { transform: scale(1.06); } }
  .matsuri .drum-g.ready .drum-face { animation: drumGlow 1.6s ease-in-out infinite; }
  @keyframes drumGlow { 50% { filter: drop-shadow(0 0 12px rgba(255,200,120,.95)); } }
  .matsuri canvas.fw { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .matsuri .finale { position: absolute; left: 0; right: 0; top: 6%; margin: 0; text-align: center; pointer-events: none;
    font-family: var(--title); font-weight: 700; font-size: clamp(20px, 4vw, 36px); letter-spacing: .12em; color: #FFE3A6;
    text-shadow: 0 0 12px rgba(255,190,90,.9), 0 0 30px rgba(255,140,60,.6); opacity: 0; transform: translateY(8px); transition: opacity 2.4s ease, transform 2.4s ease; }
  .matsuri .finale.on { opacity: 1; transform: none; }
  .room-zoom .ame { width: min(62vw, 260px); }
  .room-zoom .ame svg { width: 100%; display: block; cursor: pointer; touch-action: manipulation; }
  .room-zoom .ame-apple { transition: opacity .6s ease, transform .6s ease; transform-box: fill-box; transform-origin: center; }
  .room-zoom .ame-apple.gone { opacity: 0; transform: scale(.8); }
  .room-zoom .kingyo { width: min(88vw, 560px); }
  .room-zoom .kg-tub { aspect-ratio: 8 / 5; border-radius: 50% / 42%; overflow: hidden; touch-action: none; cursor: none;
    background: radial-gradient(ellipse at 50% 40%, #7DB7D6, #3B7AA2); box-shadow: inset 0 0 0 10px #CFE6F2, inset 0 0 40px rgba(0,30,60,.4), 0 24px 50px -20px rgba(0,0,0,.7); }
  .room-zoom .kg-tub canvas { width: 100%; height: 100%; display: block; }
  .room-zoom .zoom-x { position: absolute; top: 10px; right: 12px; width: 40px; height: 40px; padding: 0; border: 0; background: none;
    color: #F3DFB2; font-size: 22px; line-height: 40px; cursor: pointer; opacity: .75; }
  .room-zoom .zoom-x:hover, .room-zoom .zoom-x:focus-visible { opacity: 1; }
  .room-zoom .mt-tip { margin: 10px 0 0; text-align: center; color: #F3DFB2; font-family: var(--body); font-size: 18px; }
  .room-zoom .mt-reveal { animation: mtReveal .8s ease both; }
  @keyframes mtReveal { from { opacity: 0; transform: rotate(-1.5deg) scale(.92); } }
  .xmas .flake { animation: flakeFall linear infinite; animation-duration: var(--t); animation-delay: var(--d); }
  @keyframes flakeFall { to { transform: translate(var(--dx), 230px); } }
  .room-views.turning .room-view, .room-views.turning .room-side { transition: transform .9s cubic-bezier(.45,.05,.25,1), filter .9s ease; }
  /* 兩面牆中間的側牆：轉身時會經過，像真的把頭轉過去 */
  .room-side { position: absolute; top: 0; bottom: 0; width: 34%; will-change: transform; transform: translateX(400%);
               background: linear-gradient(90deg, rgba(0,0,0,.55), transparent 18%, transparent 82%, rgba(0,0,0,.55)),
                           linear-gradient(#2A2421 0 16%, #3A322D 16% 88%, #2A2019 88%); }
  /* 左右兩邊的轉身提示 */
  .turn-hint { position: absolute; top: 50%; z-index: 5; width: 34px; height: 68px; translate: 0 -50%; padding: 0;
               background: none; border: 0; cursor: pointer; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  .turn-hint.left { left: 4px; } .turn-hint.right { right: 4px; }

                   filter: drop-shadow(0 0 6px rgba(246,195,67,.7)); }
  .room.open .turn-hint { opacity: .45; pointer-events: auto; animation: hintPulse 2.6s ease-in-out infinite; }

  .room .obj { transition: filter 1.4s ease; filter: brightness(.55) saturate(.6); }

  /* 白色的門：把手往下壓，門往裡面打開，才看得到房間 */

  .rd-frame { position: relative; height: min(84svh, max(130%, 62svh), 165vw); aspect-ratio: .52; background: #CFC8BD; padding: 2.2% 2.6% 0; border-radius: 2px;

  .rd-rose { position: absolute; left: 0; top: 18%; width: 34%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F2F2F0, #A8A9AA); box-shadow: 0 2px 3px rgba(0,0,0,.25); }

  .room-back {

  .front.arrive { animation: arrive 1.1s ease both; }

  }
  .flame:focus-visible { box-shadow: 0 0 0 2px rgba(246,195,67,.85); }

    content: ""; position: absolute; left: 50%; top: 62%; width: 900%; aspect-ratio: 1; translate: -50% -50%;

  }
  @keyframes flick { from { scale: 1 1; } to { scale: .93 1.08; } }
  .flame.out { opacity: 0; animation: none; scale: .4 .1; pointer-events: none; }
  .smoke {

  /* 音樂：右下角一小朵向日葵，播放時像唱片一樣慢慢轉 */
  .disc {
    position: fixed; right: 16px; bottom: 16px; z-index: 9;

  .love.beat { animation: loveBeat .6s ease; }
  @keyframes loveBeat { 30% { transform: scale(1.12); color: #E8556D; } 60% { transform: scale(.97); } }
  .love-heart { position: fixed; z-index: 80; width: 16px; height: 15px; margin: -7px 0 0 -8px; pointer-events: none;

  @keyframes loveFly { from { transform: translate(0, 0) scale(.2) rotate(0); opacity: 1; }
    70% { opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(var(--s)) rotate(var(--r)); opacity: 0; } }

  /* 彩蛋清單：右下角的小本子 */
  .egg-zone { position: fixed; right: 0; bottom: 0; z-index: 55; width: calc(96px + env(safe-area-inset-right)); height: calc(112px + env(safe-area-inset-bottom));
    overflow: hidden; -webkit-tap-highlight-color: transparent; }

  .egg-btn.hop .toad-body { animation: toadHop .55s ease; }
  @keyframes toadHop { 35% { transform: translateY(-14px) rotate(-3deg); } 70% { transform: translateY(0) scaleY(.94); } }
  .egg-btn .toad-lamp { transition: fill .3s ease, filter .3s ease; }

  .egg-btn .egg-n { position: absolute; left: -22px; top: 0; padding: 2px 7px; border-radius: 999px; background: rgba(251,252,248,.92); color: var(--ink);
    font-family: var(--title); font-weight: 700; font-size: 12px; line-height: 1.4; box-shadow: 0 3px 8px -3px rgba(0,0,0,.4); }
  .egg-btn:focus-visible, .egg-close:focus-visible { outline: 2px dashed var(--petal-lo); outline-offset: 3px; }

  .egg-panel[hidden] { display: none; }
  .egg-card { width: min(100%, 340px); background: #FBFCF8; color: var(--ink); border-radius: 6px; padding: 22px 24px 18px;
    box-shadow: 0 24px 50px -20px rgba(0,0,0,.6); transform: rotate(-.6deg); }
  .egg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .egg-count { margin: 0; font-family: var(--title); font-weight: 700; font-size: 14px; color: var(--ink-soft); }
  .egg-reset { font: inherit; font-family: var(--title); font-size: 13px; color: var(--ink-soft); background: none; border: 1px solid rgba(59,46,37,.2);
    border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .egg-reset:hover { color: var(--ink); border-color: rgba(59,46,37,.4); }
  .egg-main[hidden], .egg-confirm[hidden] { display: none; }
  .egg-confirm { text-align: center; padding: 14px 0 4px; }

  @media (prefers-reduced-motion: reduce) {
    .head { animation: none; }

    .flame { animation: none; }
    .turn-hint { animation: none !important; }

  }

          <span class="stamp"><span class="stamp-art"><span class="val" id="stampDate">10.21</span><svg viewBox="-50 -50 100 100" aria-hidden="true"><g fill="#F6C343"><ellipse rx="7" ry="20" transform="rotate(0) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(24) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(48) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(72) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(96) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(120) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(144) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(168) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(192) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(216) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(240) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(264) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(288) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(312) translate(0 -26)"/><ellipse rx="7" ry="20" transform="rotate(336) translate(0 -26)"/></g><circle r="17" fill="#4A2E1A"/></svg><span class="cty">TAIWAN</span></span></span>

<script>
/* ── 彩蛋清單：找到的彩蛋記在右下角的小本子裡（只記在這台裝置的瀏覽器裡）。找到第一個以後，小本子才會出現 ── */
(() => {
  // 每個彩蛋要完成哪些步驟才算找到；名字在 text.js 的 CARD.eggs
  const PARTS = { matsuri: ["ame", "kingyo", "taiko"], kajinkyoku: ["bear", "penguin", "tv", "pc", "guitar", "book", "poster", "mirror"], months: Array.from({ length: 12 }, (_, i) => "m" + i) };
  const KEY = "hbd-eggs-v1";
  // CARD.eggs 是兩大類：{ "魚雁之夢": { id: 名字, … }, "花之夢": { … } }
  const groups = Object.entries(CARD.eggs || {});
  const names = Object.assign({}, ...groups.map(([, g]) => g));
  const ids = Object.keys(names);
  let got = {}, opened = false;   // opened：打開過信封了沒（小香菇要打開過信封、又找到彩蛋才出現）
  try { got = JSON.parse(localStorage.getItem(KEY)) || {}; opened = localStorage.getItem("hbd-opened-v1") === "1"; } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(got)); } catch {} };
  const isDone = (id) => { const p = PARTS[id]; return p ? p.every((k) => (got[id] || []).includes(k)) : !!got[id]; };
  const doneCount = () => ids.filter(isDone).length;

  const btn = document.createElement("button");
  btn.className = "egg-btn"; btn.hidden = true; btn.setAttribute("aria-haspopup", "dialog");
  // 探險家小香菇：頭燈、白色大香菇頭、紅圍巾、黃色吊帶褲、背包，一手十字鎬、一手蘿蔔。點他看找到了哪些彩蛋
  btn.innerHTML = `<svg class="toad" viewBox="0 0 100 124" aria-hidden="true"><g class="toad-body">
    <ellipse cx="50" cy="119" rx="26" ry="3.5" fill="rgba(0,0,0,.28)"/>
    <path d="M31 80 Q26 94 33 106 L40 106 L38 82 Z M69 80 Q74 94 67 106 L60 106 L62 82 Z" fill="#A0663A"/>
    <rect x="38" y="84" width="24" height="25" rx="9" fill="#F1E19A"/>
    <path d="M38 100 L62 100" stroke="#8A5A32" stroke-width="2.4"/><rect x="47" y="98.6" width="6" height="2.8" fill="#E9C84E"/>
    <circle cx="44" cy="91" r="2.6" fill="none" stroke="#D9C46E" stroke-width=".8"/><circle cx="56" cy="91" r="2.6" fill="none" stroke="#D9C46E" stroke-width=".8"/>
    <ellipse cx="43" cy="113" rx="9.5" ry="6" fill="#D9443A"/><ellipse cx="57" cy="113" rx="9.5" ry="6" fill="#D9443A"/>
    <path d="M35 116 Q43 120 51 116 M49 116 Q57 120 65 116" stroke="#F3C9B8" stroke-width="2" fill="none"/>
    <g class="toad-pick"><path d="M33 99 L25 73" stroke="#E2B83E" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M26.5 79 L29 77.8 M28.5 85 L31 83.8 M30.5 91 L33 89.8" stroke="#B88A22" stroke-width="1.6"/>
      <path d="M13 73 Q24 65 36 72 Q26 71 25.5 77 Q22 70 13 73 Z" fill="#3E6FA8"/></g>
    <circle cx="34" cy="95" r="4.4" fill="#F5D2B0"/>
    <g class="toad-turnip"><path d="M75 85 Q72 77 76 75 Q78 81 79 83 Q81 76 86 77 Q82 82 81 86 Z" fill="#4F9A45"/>
      <path d="M70 95 Q70 85 79 85 Q88 85 87 95 Q86 103 78 104 Q70 103 70 95 Z" fill="#FBF8F0" stroke="#E2DBCC" stroke-width=".6"/>
      <ellipse cx="81" cy="93" rx="1.1" ry="1.6" fill="#2A2422"/><ellipse cx="84.6" cy="93.4" rx="1.1" ry="1.6" fill="#2A2422"/></g>
    <circle cx="67" cy="95" r="4.4" fill="#F5D2B0"/>
    <path d="M33 80 Q50 89 67 80 L65 87 Q50 93 35 87 Z" fill="#D63B33"/>
    <rect x="30.5" y="44" width="39" height="38" rx="15" fill="#F5D2B0"/>
    <ellipse cx="43.5" cy="62" rx="2.4" ry="3.9" fill="#1F1A18"/><ellipse cx="56.5" cy="62" rx="2.4" ry="3.9" fill="#1F1A18"/>
    <circle cx="44.2" cy="60.4" r=".85" fill="#fff"/><circle cx="57.2" cy="60.4" r=".85" fill="#fff"/>
    <path d="M44.5 70 Q50 77.5 55.5 70 Q50 72.5 44.5 70 Z" fill="#C8362F"/>
    <path d="M10 58 Q2 28 24 13 Q50 -3 76 13 Q98 28 90 58 Q86 64 78 58 Q66 49 50 49 Q34 49 22 58 Q14 64 10 58 Z" fill="#FBFAF6" stroke="#E6E0D4" stroke-width=".8"/>
    <path d="M7 38 Q5 52 11 60 Q19 52 17 36 Z M93 38 Q95 52 89 60 Q81 52 83 36 Z" fill="#D63B33"/>
    <ellipse cx="50" cy="40" rx="12.5" ry="6.2" fill="#D63B33"/>
    <path d="M7 36 Q50 13 93 36" stroke="#F2D35B" stroke-width="7" fill="none"/>
    <ellipse cx="50" cy="15" rx="15.5" ry="10.5" fill="#9EA3A8"/>
    <ellipse class="toad-lamp" cx="50" cy="13.6" rx="10.5" ry="7" fill="#E9C66A"/>
    <path d="M44 8 L44 19 M48 7 L48 20.4 M52 7 L52 20.4 M56 8 L56 19" stroke="rgba(170,130,40,.45)" stroke-width="1"/>
  </g></svg><span class="egg-n"></span>`;
  const panel = document.createElement("div");
  panel.className = "egg-panel"; panel.hidden = true;
  panel.setAttribute("role", "dialog"); panel.setAttribute("aria-modal", "true"); panel.setAttribute("aria-labelledby", "eggTitle");
  panel.setAttribute("aria-label", "彩蛋"); panel.removeAttribute("aria-labelledby");
  panel.innerHTML = `<div class="egg-card">
    <div class="egg-main">
      <div class="egg-head"><p class="egg-count"></p><button class="egg-reset" type="button">↺ 重新開始</button></div>
      <div class="egg-groups"></div><button class="egg-close">關閉</button>
    </div>
    <div class="egg-confirm" hidden>
      <p>要清除紀錄，重新開始嗎？</p>
      <div class="egg-confirm-row"><button class="egg-no" type="button">取消</button><button class="egg-yes" type="button">重新開始</button></div>
    </div>
  </div>`;
  const zone = document.createElement("div");
  zone.className = "egg-zone"; zone.hidden = true; zone.append(btn); btn.hidden = false;
  const toast = document.createElement("p");
  toast.className = "egg-toast"; toast.setAttribute("role", "status");
  document.body.append(zone, panel, toast);
  // 手機沒有滑鼠：點右下角讓他探出來，幾秒後再躲回去；探出來時再點他才打開清單
  let peekT = 0;
  const peek = (ms = 4000) => { zone.classList.add("show"); clearTimeout(peekT); peekT = setTimeout(() => zone.classList.remove("show"), ms); };
  zone.addEventListener("click", (e) => { if (!e.target.closest(".egg-btn")) peek(); });

  function render() {
    const n = doneCount();
    zone.hidden = !(opened && ids.some((id) => got[id]));
    btn.querySelector(".egg-n").textContent = `${n}/${ids.length}`;
    btn.setAttribute("aria-label", `找到的彩蛋：${n} / ${ids.length}`);
    panel.querySelector(".egg-count").textContent = `${n} / ${ids.length}`;
    panel.querySelector(".egg-groups").replaceChildren(...groups.map(([title, g]) => {
      const sec = document.createElement("section"), h = document.createElement("h3"), ol = document.createElement("ol");
      const gi = Object.keys(g);
      h.textContent = title;
      const c = document.createElement("span"); c.textContent = `${gi.filter(isDone).length} / ${gi.length}`; h.append(c);
      ol.className = "egg-list";
      ol.append(...gi.map((id) => {
        const li = document.createElement("li"), p = PARTS[id], have = got[id];
        li.textContent = names[id];
        if (isDone(id)) li.className = "done";
        else if (have && p) {   // 開始了但還沒完成：顯示進度
          li.className = "half";
          const s = document.createElement("small"); s.textContent = `還差一點　${have.length} / ${p.length}`; li.append(s);
        } else { li.className = "none"; li.append(Object.assign(document.createElement("span"), { className: "sr", textContent: "（還沒找到）" })); }
        return li;
      }));
      sec.append(h, ol);
      return sec;
    }));
  }
  function cheer() {
    peek(3200);   // 找到新彩蛋時探出來跳一下
    btn.classList.remove("hop"); void btn.offsetWidth; btn.classList.add("hop", "glow");
    setTimeout(() => btn.classList.remove("hop", "glow"), 1200);
  }
  let toastT = 0;
  function say(text) {
    toast.textContent = text; toast.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove("on"), 2800);
  }
  // 給各個彩蛋呼叫：found("matsuri", "ame")；沒有步驟的直接 found("xmas")
  window.foundEgg = (id, part) => {
    if (!(id in names)) return;
    const was = isDone(id);
    if (PARTS[id]) { got[id] = got[id] || []; if (part && !got[id].includes(part)) got[id].push(part); else return; }
    else { if (got[id]) return; got[id] = true; }
    save(); render();
    if (!was && isDone(id)) { say(names[id]); cheer(); }
  };
  window.resetEggs = () => { got = {}; opened = false; save(); try { localStorage.removeItem("hbd-opened-v1"); } catch {} render(); };
  // 信封打開時呼叫；如果之前已經找到過彩蛋，小香菇這時第一次探出來打招呼
  window.markOpened = () => {
    if (opened) return;
    opened = true;
    try { localStorage.setItem("hbd-opened-v1", "1"); } catch {}
    render();
    if (!zone.hidden) setTimeout(cheer, 2600);
  };

  // 重新開始：先問一次，確定了才清掉彩蛋和「看完了」的記號，回到最一開始的信封
  const main = panel.querySelector(".egg-main"), confirmBox = panel.querySelector(".egg-confirm");
  const askReset = (on) => { main.hidden = on; confirmBox.hidden = !on; (on ? panel.querySelector(".egg-no") : panel.querySelector(".egg-reset")).focus(); };
  panel.querySelector(".egg-reset").addEventListener("click", () => askReset(true));
  panel.querySelector(".egg-no").addEventListener("click", () => askReset(false));
  panel.querySelector(".egg-yes").addEventListener("click", () => {
    got = {}; save();
    try { localStorage.removeItem("hbd-opened-v1"); sessionStorage.removeItem("cardDone"); sessionStorage.removeItem("jumpTo"); } catch {}
    scrollTo(0, 0); location.reload();
  });
  let byKey = false;   // 用鍵盤打開的才把焦點還給小香菇，不然他會一直探出來
  const close = () => { panel.hidden = true; main.hidden = false; confirmBox.hidden = true; if (byKey) btn.focus({ preventScroll: true }); else btn.blur(); };
  btn.addEventListener("click", (e) => {
    byKey = e.detail === 0; cheer(); render();
    setTimeout(() => { panel.hidden = false; panel.querySelector(".egg-close").focus(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 380);
  });
  panel.querySelector(".egg-close").addEventListener("click", close);
  panel.addEventListener("click", (e) => { if (e.target === panel) close(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) close(); });
  render();
})();
</script>

<script>
/* 把 text.js 裡的文字填進畫面；\n 換成換行 */
const textHTML = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]).replace(/\n/g, "<br>");
document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = textHTML(CARD[el.dataset.t]); });
if (!CARD.coverHint) document.querySelector(".front .hint").hidden = true;   // 封面提示留空就整行不顯示
</script>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── 日曆頁 ── */
  const d = new Date(CARD.date + "T00:00:00");
  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const weeks = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  if (!isNaN(d)) {
    $("calDay").textContent = d.getDate();
    $("calMonth").textContent = months[d.getMonth()] + " · " + d.getFullYear();
    $("calWeek").textContent = weeks[d.getDay()];
    $("insideDate").textContent = `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}（${"日一二三四五六"[d.getDay()]}）${CARD.weather}`;
    $("ghostDay").textContent = d.getDate();
  }
  $("frontLine").innerHTML = textHTML(CARD.frontLine);
  // 依打開的人那邊的時間打招呼
  const hr = new Date().getHours();
  $("greetWord").textContent = hr >= 5 && hr < 12 ? "Good morning." : hr < 18 && hr >= 12 ? "Good afternoon." : hr >= 18 && hr < 22 ? "Good evening." : "Good night.";

  /* ── 畫向日葵 ── */
  function petalPath(len, w, bend) {
    return `M0,0 C${w},${-len*.28} ${w*.85+bend},${-len*.78} ${bend},${-len}
            C${-w*.85+bend},${-len*.78} ${-w},${-len*.28} 0,0Z`;
  }
  function ring(target, count, r, len, w, fill, offset) {
    for (let i = 0; i < count; i++) {
      const a = (360 / count) * i + offset + (Math.random() * 6 - 3);
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "petal");
      g.style.setProperty("--a", a + "deg");
      g.style.setProperty("--r", -r + "px");
      g.style.setProperty("--spin", (Math.random() * 80 - 40) + "deg");
      g.style.setProperty("--d", (Math.random() * .35).toFixed(2) + "s");
      const L = len * (0.9 + Math.random() * .2);
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", petalPath(L, w * (0.88 + Math.random() * .24), Math.random() * 8 - 4));
      p.setAttribute("fill", fill);
      p.setAttribute("opacity", (0.86 + Math.random() * .14).toFixed(2));
      const v = document.createElementNS(NS, "path");
      v.setAttribute("d", `M0,-6 L0,${-L * .82}`);
      v.setAttribute("stroke", "#C9781C"); v.setAttribute("stroke-width", "1.2");
      v.setAttribute("opacity", ".35"); v.setAttribute("fill", "none");
      g.append(p, v);
      target.append(g);
    }
  }
  ring($("petalsBack"),  21, 50, 112, 22, "url(#pBack)", 8.5);
  ring($("petalsFront"), 21, 56, 100, 20, "url(#pFront)", 0);

  // 種子：黃金角螺旋，真正的向日葵就是這樣排的
  const seeds = $("seeds");
  const N = 360, golden = 137.508 * Math.PI / 180;
  for (let n = 1; n <= N; n++) {
    const r = 3.25 * Math.sqrt(n), t = n * golden;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (r * Math.cos(t)).toFixed(2));
    c.setAttribute("cy", (r * Math.sin(t)).toFixed(2));
    c.setAttribute("r", (1.3 + (n / N) * 1.1).toFixed(2));
    const k = n / N;
    c.setAttribute("fill", k < .12 ? "#9A9442" : k < .3 ? "#6E5A26" : (n % 2 ? "#2E1B0F" : "#5A3A22"));
    c.setAttribute("class", "seed");
    c.style.setProperty("--d", (k * .4).toFixed(2) + "s");
    seeds.append(c);
  }

  /* ── 內頁內容 ── */
  const to = document.createElement("span");
  to.className = "to"; to.textContent = CARD.to;
  const pu = (t) => { const e = document.createElement("span"); e.className = "pu"; e.textContent = t; return e; };
  // 標題整句照 text.js 的 title；裡面出現名字的地方標成橘色
  {
    const t = CARD.title || `${CARD.to}，生日快樂。`, at = CARD.to ? t.indexOf(CARD.to) : -1;
    if (at < 0) $("title").textContent = t;
    else { to.textContent = CARD.to; $("title").append(t.slice(0, at), to, t.slice(at + CARD.to.length)); }
  }
  const letter = $("letter");
  function loveBurst(s) {
    window.foundEgg?.("lessthan3");
    s.classList.remove("beat"); void s.offsetWidth; s.classList.add("beat");
    const r = s.getBoundingClientRect(), n = reduce ? 6 : 18;
    const colors = ["#F28AA0", "#E8556D", "#F6C343", "#F7A8B8", "#E89B2B"];
    for (let i = 0; i < n; i++) {
      const h = document.createElement("span");
      h.className = "love-heart";
      h.innerHTML = '<svg viewBox="0 0 20 18" aria-hidden="true"><path d="M10 17 C4 12 0 9 0 5 C0 2 2.3 0 5 0 C7 0 8.8 1.2 10 3 C11.2 1.2 13 0 15 0 C17.7 0 20 2 20 5 C20 9 16 12 10 17Z"/></svg>';
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, d = 60 + Math.random() * 120;
      h.style.cssText = `left:${r.left + r.width * (.2 + Math.random() * .6)}px;top:${r.top + r.height / 2}px;--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d - 30).toFixed(0)}px;--r:${(Math.random() * 60 - 30).toFixed(0)}deg;--s:${(.6 + Math.random() * .9).toFixed(2)};--t:${(1.1 + Math.random() * .9).toFixed(2)}s;--d:${(Math.random() * .18).toFixed(2)}s;color:${colors[i % colors.length]}`;
      document.body.append(h);
      setTimeout(() => h.remove(), 2400);
    }
  }
  CARD.letter.replace(/^\s*\n/, "").replace(/\s+$/, "").split("\n").forEach((line) => {   // 頭尾的空行不顯示
    const pEl = document.createElement("p");
    pEl.textContent = line || "\u00a0";
    // 小彩蛋：信裡的「Love you」看起來跟其他字一樣，點了會冒出一堆小愛心
    if (/^\s*love you\s*[!！.。♥]*\s*$/i.test(line)) {
      pEl.textContent = "";
      const s = document.createElement("span");
      s.className = "love"; s.textContent = line.trim(); s.tabIndex = 0; s.setAttribute("role", "button");
      s.addEventListener("click", () => loveBurst(s));
      s.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loveBurst(s); } });
      pEl.append(s);
    }
    letter.append(pEl);
  });
  const sign = document.createElement("span");
  sign.className = "sign"; sign.textContent = "— " + CARD.from;
  letter.append(sign);

  /* ── 照片向日葵：一個月一片花瓣 ── */
  const monthName = (ym) => ym;   // 照片頁的標題直接寫 2026.02
  // 檔名 YYYY.MM-A 是單張；YYYY.MM-A-1、YYYY.MM-A-2 是同一組、要放在一起看的一對
  const months12 = CARD.months.map((m) => {
    const groups = [], byKey = {};
    m.photos.forEach((ph) => {
      const file = typeof ph === "string" ? ph : ph.file;
      const key = (file.match(/^(\d{4}\.\d{2}-\d+)/) || [file])[0];
      if (!byKey[key]) groups.push(byKey[key] = { items: [], caption: "", month: m.month });
      const g = byKey[key];
      g.items.push({ big: `${CARD.photoDir}/1600/${file}.jpg`, small: `${CARD.photoDir}/640/${file}.jpg` });
      if (typeof ph !== "string" && ph.caption) g.caption = ph.caption;
    });
    groups.forEach((g) => { g.small = g.items[0].small; });
    return { ...m, shots: groups, count: m.photos.length };
  });

  // 每個月的照片先在背景慢慢下載：網頁載好後就開始（她還在弄信封的時候），一次兩張、優先度低，不跟其他東西搶；
  // 打開某個月的時候，那個月和下一個月排到最前面，點開時照片就已經在了
  const preQ = months12.flatMap((m) => m.shots.flatMap((g) => g.items.map((it) => it.big)));
  const preStarted = new Set();
  let preRunning = 0;
  function prePump() {
    while (preRunning < 2 && preQ.length) {
      const src = preQ.shift();
      if (preStarted.has(src)) continue;
      preStarted.add(src); preRunning++;
      const im = new Image();
      im.fetchPriority = "low"; im.decoding = "async";
      im.onload = im.onerror = () => { preRunning--; prePump(); };
      im.src = src;
    }
  }
  function preloadMonths(i) {
    const urls = [i, i + 1].filter((k) => k < months12.length).flatMap((k) => months12[k].shots.flatMap((g) => g.items.map((it) => it.big)));
    urls.reverse().forEach((u) => { const k = preQ.indexOf(u); if (k >= 0) preQ.splice(k, 1); if (!preStarted.has(u)) preQ.unshift(u); });
    prePump();
  }
  if (document.readyState === "complete") setTimeout(prePump, 1500);
  else addEventListener("load", () => setTimeout(prePump, 1500), { once: true });

  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.append(e);
    return e;
  }
  function seedHead(target, count, spread) {
    for (let n = 1; n <= count; n++) {
      const r = spread * Math.sqrt(n), t = n * golden, k = n / count;
      el("circle", {
        cx: (r * Math.cos(t)).toFixed(2), cy: (r * Math.sin(t)).toFixed(2),
        r: (1.4 + k * 1.3).toFixed(2),
        fill: k < .12 ? "#9A9442" : k < .3 ? "#6E5A26" : (n % 2 ? "#2E1B0F" : "#5A3A22"),
      }, target);
    }
  }
  function wideRay(r0, L, w) {
    return `M0,${-r0} C${w*1.05},${-r0-L*.22} ${w*.95},${-r0-L*.72} 0,${-r0-L}
            C${-w*.95},${-r0-L*.72} ${-w*1.05},${-r0-L*.22} 0,${-r0}Z`;
  }

  const pf = $("photoFlower"), n = months12.length;
  const R0 = 76, L = 192;
  const W = Math.min(72, Math.tan(Math.PI / n) * (R0 + L * .45) * 1.02);
  const defs = el("defs", {}, pf);
  const tint = el("linearGradient", { id: "baseTint", gradientUnits: "userSpaceOnUse", x1: 0, y1: -R0, x2: 0, y2: -R0 - L * .42 }, defs);
  el("stop", { offset: 0, "stop-color": "#E89B2B", "stop-opacity": .95 }, tint);
  el("stop", { offset: 1, "stop-color": "#F6C343", "stop-opacity": 0 }, tint);
  // 封面的 SVG 打開後會被藏起來，漸層要另外放一份在這裡
  const pfBack = el("linearGradient", { id: "pfBack", x1: 0, y1: 1, x2: 0, y2: 0 }, defs);
  [["0", "#D98A22"], [".55", "#EBAA35"], ["1", "#F2BE48"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, pfBack));
  const pfDisc = el("radialGradient", { id: "pfDisc" }, defs);
  [["0", "#7A7230"], [".35", "#5E4220"], ["1", "#3A2414"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, pfDisc));

  // 後面一圈純黃色小花瓣，讓花看起來是滿的
  const back = el("g", { filter: "url(#wc)" }, pf);
  // 每兩片照片花瓣之間塞一片，填滿縫隙
  for (let j = 0; j < n; j++) {
    const g = el("g", { class: "bp" }, back);
    g.style.setProperty("--a", (360 / n * (j + .5)) + "deg");
    g.style.setProperty("--d", (j * .05).toFixed(2) + "s");
    el("path", { d: wideRay(R0 - 8, L * .8, W * .8), fill: "url(#pfBack)", opacity: .95 }, g);
  }

  const rays = el("g", {}, pf);
  const petals = [];
  let firstIdx = 0;
  months12.forEach((mo, i) => {
    // 每片角度、長度都差一點點，看起來才像真的花
    const a = 360 / n * i - 6 + (Math.random() * 6 - 3), Li = L * (.92 + Math.random() * .1);
    const cy = -R0 - Li / 2, S = Li * 1.02;
    const has = mo.shots.length > 0, start = firstIdx;
    firstIdx += mo.shots.length;
    const g = el("g", { class: "pp" + (has ? "" : " empty"), tabindex: 0, role: "button",
                        "aria-label": `摘下 ${monthName(mo.month)}${has ? `，${mo.count} 張照片` : ""}` }, rays);
    g.style.setProperty("--a", a + "deg");
    g.style.setProperty("--d", (.25 + i * .11).toFixed(2) + "s");
    const d = wideRay(R0, Li, W * (.92 + Math.random() * .12));
    el("path", { class: "rim", d, fill: has ? "#F6C343" : "url(#pfBack)", stroke: "#F2B93B", "stroke-width": has ? 10 : 6,
                 "stroke-linejoin": "round", filter: "url(#wc)" }, g);
    if (has) {
      const cp = el("clipPath", { id: "pc" + i }, defs);
      el("path", { d }, cp);
      const clip = el("g", { "clip-path": `url(#pc${i})` }, g);
      // 照片反向轉回來，不管花瓣朝哪，照片都是正的
      el("image", { href: mo.shots[0].small, x: -S / 2, y: cy - S / 2, width: S, height: S,
                    preserveAspectRatio: "xMidYMid slice", transform: `rotate(${-a} 0 ${cy})` }, clip);
      el("path", { d, fill: "url(#baseTint)" }, clip);
    }
    const petal = { i, a, Li, d, mo, g, has, cy, S };
    petals.push(petal);
    g.addEventListener("click", () => pluck(petal));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pluck(petal); } });
  });

  const core = el("g", { class: "disc-core" }, pf);
  el("circle", { r: R0 + 8, fill: "url(#pfDisc)", filter: "url(#wc)" }, core);
  seedHead(el("g", {}, core), 520, 3.55);
  // 小彩蛋：520 顆種子裡有一顆是愛心形的，偶爾閃一下
  const secretSeed = CARD.secretSeed && (CARD.secretSeed.photo || (CARD.secretSeed.videos || []).length)
    ? el("g", { class: "secret-seed", transform: "translate(-31 26)", tabindex: 0, role: "button", "aria-label": "一顆不一樣的種子" }, core)
    : null;
  if (secretSeed) {
    el("circle", { r: 14, fill: "transparent" }, secretSeed);   // 手指好點的範圍
    el("path", { class: "heart", d: "M0 4 C-7 -1 -5 -8 0 -4.5 C5 -8 7 -1 0 4Z", fill: "#D9A441" }, secretSeed);
  }

  // 下面那排小花瓣：收下一片就塗滿一格
  const tally = $("tally");
  months12.forEach((mo) => {
    const li = document.createElement("li");
    li.setAttribute("aria-label", monthName(mo.month));
    tally.append(li);
  });

  const pflower = $("pflower"), insideEl = $("inside");
  // 捲到花出現在畫面裡，花瓣才一片片打開
  function maybeUnfurl() {
    if (pflower.classList.contains("unfurl") || insideEl.hidden) return;
    const r = pflower.getBoundingClientRect();
    if (r.top < innerHeight * .7 && r.bottom > 0) pflower.classList.add("unfurl");
  }
  addEventListener("scroll", maybeUnfurl, { passive: true });
  addEventListener("resize", maybeUnfurl);

  /* ── 摘花瓣：花瓣飛向鏡頭，變成那個月的照片頁 ── */
  const lb = $("lightbox"), flyLayer = $("flyLayer");
  let curMonth = null, cur = 0, lastPetal = null, busy = false;
  const collected = new Set();

  function show(k) {
    const list = curMonth.shots, box = $("lbPhotos");
    if (!list.length) {
      box.replaceChildren(); box.hidden = true;
      $("lbEmpty").hidden = false; $("lbNav").hidden = true; $("lbCap").textContent = "";
      return;
    }
    cur = (k + list.length) % list.length;
    const sh = list[cur], pair = sh.items.length > 1;
    $("lbEmpty").hidden = true; box.hidden = false;
    box.className = "lb-photos" + (pair ? " pair" : "");
    const cardEl = lb.querySelector(".lb-card");
    cardEl.classList.toggle("has-pair", pair);
    cardEl.style.width = "";
    const label = `${sh.month ? monthName(sh.month) : (CARD.seedTitle || "")}${sh.caption ? "：" + sh.caption : ""}`;
    const imgs = sh.items.map((it, i) => {
      const nth = pair ? `（一組中的第 ${i + 1} 個）` : "";
      if (it.video) {
        // 影片：一起播、重複播，點一下暫停／繼續
        const v = document.createElement("video");
        Object.assign(v, { src: it.video, poster: it.poster, loop: true, playsInline: true, autoplay: true, preload: "auto", muted: true });
        v.setAttribute("muted", "");   // 靜音，背景音樂照常播
        v.setAttribute("aria-label", label + nth);
        v.addEventListener("click", () => (v.paused ? v.play() : v.pause()));
        v.play().catch(() => {});
        return v;
      }
      const img = new Image();
      img.src = it.big;
      img.alt = label + nth;
      return img;
    });
    box.replaceChildren(...imgs);
    if (pair) {
      // 依比例分配寬度，高度對齊；全都是橫的就在窄螢幕上改成上下排
      const ready = (m) => m.tagName === "VIDEO"
        ? (m.readyState >= 1 ? Promise.resolve() : new Promise((r) => m.addEventListener("loadedmetadata", r, { once: true })))
        : m.decode().catch(() => {});
      Promise.all(imgs.map(ready)).then(() => {
        const ars = imgs.map((m) => (m.tagName === "VIDEO" ? m.videoWidth / m.videoHeight : m.naturalWidth / m.naturalHeight) || 1);
        imgs.forEach((im, i) => im.style.setProperty("--ar", ars[i].toFixed(3)));
        // 一排的總寬高比太大（例如橫＋直、或三張橫的），手機上就改成上下排
        box.classList.toggle("landscape", ars.reduce((a, b) => a + b, 0) > 1.8);
        box.style.setProperty("--n", ars.length);
        // 卡片寬度依兩張的比例算：高度剛好不超過畫面的 60%，照片不會被裁
        const sum = ars.reduce((a, b) => a + b, 0);
        if (!(box.classList.contains("landscape") && innerWidth <= 600))
          cardEl.style.width = `min(100%, ${Math.round(Math.min(820, innerHeight * .6 * sum + 8 + 28))}px)`;
      });
    }
    $("lbCap").textContent = sh.caption;
    $("lbNav").hidden = list.length < 2;
    $("lbCount").textContent = `${cur + 1} / ${list.length}`;
  }
  // 愛心種子頁的標題和說明：放在影片下面，淡淡地浮出來
  function seedWords(on) {
    const cap = $("lbCap");
    cap.classList.remove("seed-words", "in");
    if (!on) { cap.textContent = ""; return; }
    cap.innerHTML = "";
    const t = document.createElement("span"); t.className = "seed-title";
    t.innerHTML = textHTML(CARD.seedTitle || "").replace(/[，。、！？：；]/g, (m) => `<span class="pu">${m}</span>`);   // 日文明朝體的標點會偏，改用中文字體
    const c = document.createElement("span"); c.className = "seed-cap"; c.innerHTML = textHTML(CARD.seedCaption || "");
    cap.append(t, c);
    cap.classList.add("seed-words");
    requestAnimationFrame(() => requestAnimationFrame(() => cap.classList.add("in")));
  }
  function openMonth(petal) {
    $("lbMonth").hidden = false;
    $("lbCap").classList.remove("seed-words", "in");
    resetSparkler(true);
    curMonth = petal.mo; lastPetal = petal;
    preloadMonths(months12.indexOf(petal.mo));
    $("lbMonth").textContent = monthName(petal.mo.month);
    show(0);
    lb.hidden = false;
    requestAnimationFrame(() => lb.classList.add("on"));
    $("lbClose").focus({ preventScroll: true });
  }

  // 做一片一模一樣的花瓣放在最上層，讓它在 3D 空間裡飛起來
  function flyingPetal(p) {
    const W2 = W * 1.25 + 8, top = -R0 - p.Li - 10, h = p.Li + 20;
    const svg = el("svg", { viewBox: `${-W2} ${top} ${W2 * 2} ${h}` });
    el("path", { d: p.d, fill: p.has ? "#F6C343" : "url(#pfBack)", stroke: "#F2B93B", "stroke-width": 10, "stroke-linejoin": "round", filter: "url(#wc)" }, svg);
    let img = null;
    if (p.has) {
      const cpId = "fly" + p.i;
      el("path", { d: p.d }, el("clipPath", { id: cpId }, svg));
      const clip = el("g", { "clip-path": `url(#${cpId})` }, svg);
      img = el("image", { href: p.mo.shots[0].small, x: -p.S / 2, y: p.cy - p.S / 2, width: p.S, height: p.S,
                          preserveAspectRatio: "xMidYMid slice", transform: `rotate(${-p.a} 0 ${p.cy})` }, clip);
      el("path", { d: p.d, fill: "url(#baseTint)" }, clip);
    }
    return { svg, img, W2, top, h };
  }

  async function pluck(p) {
    if (busy || (mode === "pluck" && collected.has(p.i))) return;
    busy = true;
    const box = pf.getBoundingClientRect(), s = box.width / 600;
    const cxF = box.left + box.width / 2, cyF = box.top + box.height / 2;
    const fp = flyingPetal(p);
    const wPx = fp.W2 * 2 * s, hPx = fp.h * s;
    // 花瓣中心在畫面上的位置（相對整朵花的中心，轉 a 度）
    const rMid = -(fp.top + fp.h / 2), rad = p.a * Math.PI / 180;
    const px = cxF + rMid * s * Math.sin(rad), py = cyF - rMid * s * Math.cos(rad);
    const div = document.createElement("div");
    div.className = "fly";
    Object.assign(div.style, { left: px - wPx / 2 + "px", top: py - hPx / 2 + "px", width: wPx + "px", height: hPx + "px" });
    div.append(fp.svg); flyLayer.append(div);
    p.g.classList.add("plucked");

    const dx = innerWidth / 2 - px, dy = innerHeight / 2 - py;
    const K = Math.max(innerHeight * 1.5 / hPx, innerWidth * 1.3 / wPx);   // 飛到比畫面還大，像衝到鏡頭前
    const T = reduce ? 1 : 1150, t0 = performance.now();
    const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    let shown = false;
    await new Promise((done) => {
      const frame = (now) => {
        const t = Math.min(1, (now - t0) / T), e = ease(t), arc = Math.sin(Math.PI * Math.min(1, t * 1.3));
        const rot = p.a * (1 - e);
        const scale = 1 + (K - 1) * Math.pow(e, 2.2);
        div.style.transform =
          `translate3d(${dx * e}px, ${dy * e - arc * 70}px, ${arc * 160}px) rotate(${rot}deg) rotateX(${arc * 26}deg) rotateY(${arc * -14}deg) scale(${scale})`;
        // 花瓣轉正的同時，照片反過來轉，整趟飛行照片都是正的
        if (fp.img) fp.img.setAttribute("transform", `rotate(${-rot} 0 ${p.cy})`);
        div.style.opacity = t > .82 ? String(1 - (t - .82) / .18) : "1";
        if (!shown && t > .7) { shown = true; openMonth(p); }
        if (t < 1) requestAnimationFrame(frame); else done();
      };
      requestAnimationFrame(frame);
    });
    div.remove();
    busy = false;
  }

  let secretOpen = false;
  function openSecret(e) {
    e.stopPropagation();   // 不要順便觸發「打開花心」
    if (busy || !lb.hidden) return;
    const sc = CARD.secretSeed;
    secretOpen = true;
    const items = sc.videos && sc.videos.length
      ? sc.videos.map((v) => ({ video: `${CARD.photoDir}/video/${v}.mp4`, poster: `${CARD.photoDir}/video/${v}.jpg` }))
      : [{ big: `${CARD.photoDir}/1600/${sc.photo}.jpg` }];
    // 有仙女棒的話，先只放第一支；燒完才換成全部
    const withSpark = sc.sparkler && items.length > 1;
    secretAll = items;
    curMonth = { shots: [{ items: withSpark ? items.slice(0, 1) : items, caption: "", month: "" }] };
    resetSparkler(!withSpark);
    $("lbMonth").textContent = ""; $("lbMonth").hidden = true;
    show(0);
    seedWords(!withSpark);   // 沒有仙女棒就直接顯示；有的話等燒完
    $("lbClose").textContent = CARD.seedClose;
    lb.hidden = false;
    requestAnimationFrame(() => { lb.classList.add("on"); if (withSpark) sparkIdle(); });
    $("lbClose").focus({ preventScroll: true });
  }

  /* ── 仙女棒：點燃 → 從尖端燒到手柄，一路噴火花 → 熄滅 → 第二支影片出現 ── */
  let secretAll = [];
  const SP = { wrap: $("sparkler"), btn: $("sparkBtn"), cv: $("sparkCv"), hint: $("sparkHint"), state: "off", raf: 0, parts: [] };
  const BURN = 7, COAT = .34;   // 燒 7 秒；手柄那 34% 是沒有藥的鐵絲
  function resetSparkler(hide) {
    cancelAnimationFrame(SP.raf);
    revealPair.done = false; rest = [];
    SP.state = "off"; SP.parts = [];
    SP.wrap.hidden = !!hide; SP.wrap.classList.remove("gone");
    SP.hint.style.opacity = "1";
    lb.classList.remove("dusk");
  }
  function sparkSize() {
    const r = SP.btn.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    SP.W = r.width; SP.H = r.height;
    SP.cv.width = Math.round(r.width * dpr); SP.cv.height = Math.round(r.height * dpr);
    SP.ctx = SP.cv.getContext("2d"); SP.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SP.a = { x: SP.W * .14, y: SP.H * .84 };   // 手柄
    SP.b = { x: SP.W * .86, y: SP.H * .2 };    // 尖端
  }
  const along = (f) => ({ x: SP.a.x + (SP.b.x - SP.a.x) * f, y: SP.a.y + (SP.b.y - SP.a.y) * f });
  function drawRod(f, lit) {
    const c = SP.ctx, A = SP.a, B = along(1), P = along(f), C = along(COAT);
    c.lineCap = "round";
    // 鐵絲
    c.strokeStyle = "#9A948A"; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(A.x, A.y); c.lineTo(B.x, B.y); c.stroke();
    // 還沒燒的藥
    if (f > COAT) {
      c.strokeStyle = "#7B7368"; c.lineWidth = 6.5;
      c.beginPath(); c.moveTo(C.x, C.y); c.lineTo(P.x, P.y); c.stroke();
      c.strokeStyle = "rgba(255,255,255,.12)"; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(C.x, C.y - 2); c.lineTo(P.x, P.y - 2); c.stroke();
    }
    // 燒過的地方：焦黑的鐵絲
    if (lit && f < 1) {
      c.strokeStyle = "#3A2A22"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(P.x, P.y); c.lineTo(B.x, B.y); c.stroke();
    }
    // 燃燒點
    if (lit && SP.state === "burn") {
      const g = c.createRadialGradient(P.x, P.y, 0, P.x, P.y, 34);
      g.addColorStop(0, "rgba(255,236,170,.9)"); g.addColorStop(.25, "rgba(255,190,90,.45)"); g.addColorStop(1, "rgba(255,150,60,0)");
      c.fillStyle = g; c.beginPath(); c.arc(P.x, P.y, 34, 0, 7); c.fill();
      c.fillStyle = "#FFF6D8"; c.beginPath(); c.arc(P.x, P.y, 2.8, 0, 7); c.fill();
    }
  }
  function spawn(P, n, speed, life, kid) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, v = speed[0] + Math.random() * (speed[1] - speed[0]);
      const L = life[0] + Math.random() * (life[1] - life[0]);
      SP.parts.push({ x: P.x, y: P.y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 30, life: L, max: L, kid });
    }
  }
  function drawParts(dt) {
    const c = SP.ctx;
    c.globalCompositeOperation = "lighter";
    const next = [];
    for (const q of SP.parts) {
      q.life -= dt; if (q.life <= 0) continue;
      q.vy += 160 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      // 飛到一半，有些火花會再炸開一次（劈啪）
      if (!q.kid && q.life < q.max * .5 && Math.random() < .03) spawn(q, 3, [40, 120], [.1, .22], 1);
      const k = q.life / q.max;
      c.strokeStyle = k > .6 ? "#FFFBE6" : k > .3 ? "#FFD27A" : "#FF9A3C";
      c.globalAlpha = Math.min(1, k * 1.6);
      c.lineWidth = q.kid ? .9 : 1.3;
      c.beginPath(); c.moveTo(q.x, q.y); c.lineTo(q.x - q.vx * .035, q.y - q.vy * .035); c.stroke();

    }
